# Typecheck and test on every push and pull request, on Linux and on Windows.
# Development happens on Linux; Windows is a release target that must not
# quietly break (ROADMAP: "Primary platform: Linux").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # The pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      # The Node the controller ships with, so tests run on what is installed.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      # Typecheck and tests need Electron's types, which ship in the npm
      # package, but not its ~100 MB runtime. Skipping the download takes a
      # network fetch that can fail out of every run.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm typecheck
      - run: pnpm test
