function GrowCyclePage({ setup, completed, onGoAutomation, onGoJournal }) {
  const [view, setView] = useState(completed ? "completed" : setup ? "new" : "active");
  const [aborting, setAborting] = useState(false);
  const [archived, setArchived] = useState(false);
  const [reason, setReason] = useState(null);
  const [stages, setStages] = useState(() => STAGE_DEF.map((s, i) => ({ ...s, weeks: [2, 4, 8, 1][i] })));
  const [name, setName] = useState(setup && !completed ? "" : "Grow #3 — Northern Lights");
  const [strain, setStrain] = useState(setup && !completed ? "" : "Northern Lights");
  const [start, setStart] = useState(setup && !completed ? "2026-05-30" : "2026-05-07");
  const [tpl, setTpl] = useState("photo");

  if (view === "completed") return <HarvestScreen name={name || "Grow #3"} strain={strain || "Northern Lights"} stages={stages} start={start} onStartNext={() => setView("new")} onGoJournal={onGoJournal} />;

  const isSetup = view === "new";
  const totalWeeks = stages.reduce((n, s) => n + s.weeks, 0);
  const totalDays = totalWeeks * 7;
  const currentDay = isSetup ? 0 : 24;
  const nearEnd = !isSetup && totalDays > 0 && currentDay / totalDays >= 0.8;

  let acc = 0;
  const ranges = stages.map((s) => {
    const startDay = acc + 1, endDay = acc + s.weeks * 7; acc = endDay;
    const sd = gcAddDays(start, startDay - 1), ed = gcAddDays(start, endDay - 1);
    const status = isSetup ? "planned" : currentDay > endDay ? "complete" : currentDay >= startDay ? "active" : "upcoming";
    return { ...s, startDay, endDay, sd, ed, status };
  });
  const harvest = gcAddDays(start, Math.max(0, totalDays - 1));
  const activeStage = ranges.find((r) => r.status === "active");

  const bump = (id, d) => setStages((prev) => prev.map((s) => (s.id === id ? { ...s, weeks: Math.max(0, Math.min(20, s.weeks + d)) } : s)));
  const applyTpl = (t) => { setTpl(t.id); setStages(STAGE_DEF.map((s, i) => ({ ...s, weeks: t.weeks[i] }))); };
  const segStyle = (r) => {
    if (r.status === "active") return { background: r.color, color: "#fff" };
    if (r.status === "complete") return { background: r.color + "59", color: "var(--fg-default)" };
    return { background: r.color + "24", color: "var(--fg-muted)" };
  };

  return (
    <>
      <div className="content-header">
        <div className="ch-titles">
          <div className="ch-crumb">Tent 1 <span className="sep">/</span> {isSetup ? "New grow" : "Northern Lights"} <span className="sep">/</span> Grow Cycle</div>
          <div className="ch-title">Grow Cycle
            {isSetup
              ? <span className="tag b-info">New grow · setup</span>
              : <span className="tag b-ok"><span className="dot-live" style={{ width:7, height:7 }} />Day {currentDay}{activeStage ? " · " + activeStage.name : ""}</span>}
          </div>
        </div>
        <div className="ch-actions">
          {isSetup
            ? <button className="btn primary"><IcoCheck s={14} /> Start grow</button>
            : <>
                <button className="btn ghost-danger" onClick={() => { setAborting((v) => !v); setArchived(false); }}><IcoX s={13} /> Abort grow</button>
                <button className={nearEnd ? "btn primary" : "btn"} onClick={() => setView("completed")}><IcoCheck s={14} /> {nearEnd ? "Complete · Harvest" : "Complete grow"}</button>
              </>}
        </div>
      </div>

      <div className="scroll">
        <div className="canvas-pad">
          {archived && (
            <div className="archived-banner"><IcoCheck s={15} /><div><b>Grow aborted</b>{reason ? " — " + reason : ""}. Saved to this setup’s archive.</div><button className="btn sm" onClick={onGoJournal}>View in History</button><button className="btn sm" onClick={() => { setArchived(false); setView("new"); }}>Start new grow</button></div>
          )}
          {aborting && <AbortPanel reason={reason} setReason={setReason} onCancel={() => setAborting(false)} onConfirm={() => { setAborting(false); setArchived(true); }} />}

          <div className="summary-strip">

          <div className="callout" style={{ marginTop: 4 }}>
            <span className="callout-ico"><IcoCycle s={16} /></span>
            <div className="callout-body">
              <div className="callout-title">The cycle drives the Automation mode</div>
              <div className="callout-text">
                {isSetup
                  ? <>Once started, each stage switches Automation to its growth mode on schedule. Grow Cycle decides <b>when</b> a mode is active; Automation decides <b>what</b> it does.</>
                  : <>Right now the active stage holds Automation in <b>{activeStage ? activeStage.name : "—"}</b> mode. Grow Cycle decides <b>when</b> a mode is active; the <span className="mono-ref">Automation</span> Mode switcher is your manual override.</>}
              </div>
            </div>
            <button className="btn sm" onClick={onGoAutomation}>Open Automation</button>
          </div>

          <div className="sec-head" style={{ marginTop: 26 }}>
            <h2>Stages</h2>
            <span className="count">{stages.length}</span>
            <span className="rule" />
          </div>
          <div className="gc-list">
            {ranges.map((r) => {
              const mode = MODES.find((m) => m.id === r.mode);
              return (
                <div className="gc-row" key={r.id}>
                  <span className="gc-dot" style={{ background: r.color }} />
                  <div className="gc-row-main">
                    <div className="gc-stage-name">{r.name}
                      <span className="gc-mode-chip" onClick={onGoAutomation} title="Open this mode in Automation">{mode ? mode.name : r.mode} mode</span>
                    </div>
                    <div className="gc-range">{r.weeks > 0 ? `${gcFmt(r.sd)} – ${gcFmt(r.ed)} · ${r.weeks * 7} days` : "skipped"}</div>
                  </div>
                  <GcStatus status={r.weeks === 0 ? "upcoming" : r.status} />
                  <div className="gc-stepper">
                    <button onClick={() => bump(r.id, -1)} disabled={r.weeks <= 0} title="Fewer weeks"><IcoMinus s={14} /></button>
                    <span className="gc-wk">{r.weeks}<small>wk</small></span>
                    <button onClick={() => bump(r.id, 1)} disabled={r.weeks >= 20} title="More weeks"><IcoPlus s={14} /></button>
                  </div>
                  <button className="gc-link" onClick={onGoAutomation}>Edit mode <IcoArrowRight s={13} /></button>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </>
  );
}

const J_TODAY = 24, J_DAYS = 105;
function jLevel(d) {
  if (d > J_TODAY) return -1;
  const e = JOURNAL_ENTRIES.find((x) => x.day === d);
  if (e) return e.type === "experiment" || e.type === "photo" ? 4 : 3;
  let l = 0; if (d % 2 === 0) l++; if (d % 3 === 0) l++; return Math.min(2, l);
}
function jCellStyle(lvl) {
  if (lvl < 0) return { background: "transparent", borderColor: "var(--border-muted)" };
  if (lvl === 0) return { background: "var(--canvas-subtle)" };
  const pct = [0, 38, 58, 78, 100][lvl];
  return { background: `color-mix(in srgb, var(--success-fg) ${pct}%, var(--canvas-subtle))` };
}

function MiniStages({ w }) {
  const tot = w.reduce((x, y) => x + y, 0) || 1;
  return <span className="mini-stages">{w.map((wk, i) => wk > 0 ? <span key={i} style={{ width: (wk / tot * 100) + "%", background: STAGE_DEF[i].color }} title={STAGE_DEF[i].name + " " + wk + "w"} /> : null)}</span>;
}

  const done = g.status === "completed";

    <div className={"ar-row" + (checked ? " sel" : "")}>

}

function ComparePanel({ a, b }) {

    ["RH", a.env.rh, b.env.rh],
    ["Techniques", a.tech.join(", "), b.tech.join(", ")],

function JournalHistory() {
  const [cmp, setCmp] = useState(["g2", "g1"]);
  const toggle = (id) => setCmp((p) => (p.includes(id) ? p.filter((x) => x !== id) : p.length < 2 ? [...p, id] : [p[1], id]));

  return (
    <>
      <div className="sec-head"><h2>Grow history</h2><span className="count">{ARCHIVE.length} archived · Tent 1</span><span className="rule" /><span className="link" style={{ cursor: "default", color: "var(--fg-subtle)" }}>tick two completed grows to compare</span></div>

function ProgressRing({ done, total, size = 26 }) {
  const r = (size - 4) / 2, c = 2 * Math.PI * r, pct = total ? done / total : 0;
  const complete = done === total;
  const col = complete ? "var(--success-fg)" : "var(--accent-fg)";
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border-default)" strokeWidth="2.5" />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth="2.5"
        strokeDasharray={c} strokeDashoffset={c * (1 - pct)} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`} />
      {complete && <path d={`M${size*0.32} ${size*0.52} l${size*0.12} ${size*0.12} l${size*0.22} -${size*0.26}`} fill="none" stroke={col} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />}
    </svg>
  );
}

// seeded pseudo-random so charts are stable across renders
function lgRand(seed) { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
// generate N points for a metric given a daily pattern
function genSeries(seed, base, amp, noise, dayNight) {
  const rnd = lgRand(seed); const pts = []; const N = 96; // 96 = 4 days * 24h sample
  for (let i = 0; i < N; i++) {
    const hod = (i % 24);
    const lightsOn = hod >= 6 && hod < 24; // 18/6
    const diurnal = Math.sin(((hod - 6) / 24) * Math.PI * 2);
    let v = base + (dayNight ? (lightsOn ? amp : -amp) : amp * diurnal) + (rnd() - 0.5) * noise;
    pts.push(v);
  }
  return pts;
}

/* ============================================================
   LOGGING — chart engine
============================================================ */
function niceBounds(min, max) {
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.12; return [min - pad, max + pad];
}
function seriesStats(data) {
  const avg = data.reduce((a, b) => a + b, 0) / data.length;
  return { avg, min: Math.min(...data), max: Math.max(...data) };
}
function pathFor(data, x0, w, y0, h, lo, hi) {
  const n = data.length;
  return data.map((v, i) => {
    const x = x0 + (i / (n - 1)) * w;
    const y = y0 + (1 - (v - lo) / (hi - lo)) * h;
    return (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1);
  }).join(" ");
}

// Night shading bands for an 18/6 schedule across the visible window (lights off 00:00–06:00 each day)
function nightBands(x0, w, days) {
  const bands = [];
  for (let d = 0; d < days; d++) {
    const dayStart = d / days;
    const offEnd = (d + 6 / 24) / days; // 6h off at start of each cycle
    bands.push({ x: x0 + dayStart * w, w: (offEnd - dayStart) * w });
  }
  return bands;
}

function ChartPanel({ metrics, mode, range, showNight, showTargets, showOOR, evtFilter, onToggleOpt }) {
  const W = 860, padL = 42, padR = 42, plotW = W - padL - padR;
  const winPts = range === "24h" ? 24 : 96; // window the series to the range
  const days = winPts / 24;
  const wd = (m) => m.data.slice(-winPts);
  const events = LG_EVENTS.filter((e) => evtFilter[e.type]);
  const [hover, setHover] = useState(null);

  // group metrics by axis for overlay mode; in stack mode each metric gets its own lane
  const lanes = mode === "stack"
    ? metrics.map((m) => ({ axes: [m.axis], metrics: [m] }))
    : (() => {
        // overlay: collect axes, but render all in one lane; left/right axis groups
        return [{ axes: [...new Set(metrics.map((m) => m.axis))], metrics }];
      })();

  const laneH = mode === "stack" ? 86 : 300;
  const laneGap = mode === "stack" ? 16 : 0;
  const totalH = lanes.length * laneH + (lanes.length - 1) * laneGap;
  const xticks = LG_XTICKS[range] || LG_XTICKS["24h"];

  return (
    <div className="chart-box">
      <div className="chart-head">
        <div className="ch-legend">
          {metrics.map((m) => (
            <span className="cl-item" key={m.id}><span className="cl-line" style={{ background: m.color }} /><b>{m.name}</b> {m.value}{m.unit}</span>
          ))}
          {metrics.length === 0 && <span className="cl-item">No metrics selected — toggle some on the left</span>}
        </div>
        <div className="chart-opts">
          <button className={"copt" + (showNight ? " on" : "")} onClick={() => onToggleOpt("night")} title="Shade lights-off periods"><span className="swatch-sq cf-hatch" style={{ background: "var(--fg-muted)" }} /> Night</button>
          <button className={"copt" + (showTargets ? " on" : "")} onClick={() => onToggleOpt("targets")} title="Draw target bands"><IcoTarget s={12} /> Targets</button>
          <button className={"copt" + (showOOR ? " on" : "")} onClick={() => onToggleOpt("oor")} title="Highlight out-of-range">Out-of-range</button>
        </div>
      </div>

      <div className="chart-canvas" style={{ position: "relative" }}>
        <svg className="chart-svg" viewBox={`0 0 ${W} ${totalH + 8}`} preserveAspectRatio="none">
          <defs>
            <pattern id="nightHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="6" height="6" fill="transparent" />
              <line x1="0" y1="0" x2="0" y2="6" stroke="var(--fg-muted)" strokeWidth="1" opacity="0.25" />
            </pattern>
          </defs>
          {lanes.map((lane, li) => {
            const y0 = li * (laneH + laneGap) + 4;
            const primary = lane.metrics[0];
            // bounds per axis (use first metric's axis as primary scale for the lane)
            const axisBounds = {};
            lane.axes.forEach((ax) => {
              const ms = lane.metrics.filter((m) => m.axis === ax);
              const all = ms.flatMap((m) => wd(m));
              axisBounds[ax] = niceBounds(Math.min(...all), Math.max(...all));
            });
            const primaryAx = primary ? primary.axis : "temp";
            const [plo, phi] = axisBounds[primaryAx] || [0, 1];

            return (
              <g key={li}>
                {/* night shading */}
                {showNight && nightBands(padL, plotW, days).map((b, bi) => (
                  <rect key={bi} className="night-hatch" x={b.x} y={y0} width={b.w} height={laneH} />
                ))}
                {/* grid */}
                {[0, 0.25, 0.5, 0.75, 1].map((g, gi) => (
                  <line key={gi} className="grid-line" x1={padL} y1={y0 + g * laneH} x2={padL + plotW} y2={y0 + g * laneH} />
                ))}
                {/* target band for primary (overlay) or each metric (stack) */}
                {showTargets && lane.metrics.map((m) => {
                  const [lo, hi] = axisBounds[m.axis];
                  const ty1 = y0 + (1 - (m.target[1] - lo) / (hi - lo)) * laneH;
                  const ty2 = y0 + (1 - (m.target[0] - lo) / (hi - lo)) * laneH;
                  return (
                    <g key={m.id}>
                      <rect x={padL} y={ty1} width={plotW} height={Math.max(0, ty2 - ty1)} fill={m.color} opacity="0.07" />
                      <line className="target-band-l" x1={padL} y1={ty1} x2={padL + plotW} y2={ty1} stroke={m.color} opacity="0.5" />
                      <line className="target-band-l" x1={padL} y1={ty2} x2={padL + plotW} y2={ty2} stroke={m.color} opacity="0.5" />
                    </g>
                  );
                })}
                {/* out-of-range highlighting — primary metric only in overlay to avoid clutter */}
                {showOOR && (mode === "stack" ? lane.metrics : lane.metrics.slice(0, 1)).map((m) => {
                  const [lo, hi] = axisBounds[m.axis];
                  const segs = [];
                  const dd = wd(m);
                  dd.forEach((v, i) => {
                    if (v < m.target[0] || v > m.target[1]) {
                      const x = padL + (i / (dd.length - 1)) * plotW;
                      segs.push(x);
                    }
                  });
                  const bw = plotW / (dd.length - 1);
                  return segs.map((x, si) => <rect key={m.id + si} className="oor-band" x={x - bw/2} y={y0} width={bw} height={laneH} fill="var(--danger-fg)" />);
                })}
                {/* series lines */}
                {lane.metrics.map((m) => {
                  const [lo, hi] = axisBounds[m.axis];
                  return <path key={m.id} d={pathFor(wd(m), padL, plotW, y0, laneH, lo, hi)} fill="none" stroke={m.color} strokeWidth="1.6" strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke" />;
                })}
                {/* left axis labels (primary) */}
                {primary && [0, 0.5, 1].map((g, gi) => {
                  const val = phi - g * (phi - plo);
                  return <text key={gi} className="axis-label" x={padL - 5} y={y0 + g * laneH + 3} textAnchor="end">{val.toFixed(primaryAx === "vpd" ? 1 : 0)}</text>;
                })}
                {/* right axis label (secondary axis if exists) */}
                {(() => {
                  const rightAx = lane.axes.find((a) => a !== primaryAx);
                  if (!rightAx) return null;
                  const [rlo, rhi] = axisBounds[rightAx];
                  return [0, 0.5, 1].map((g, gi) => {
                    const val = rhi - g * (rhi - rlo);
                    return <text key={"r"+gi} className="axis-label" x={padL + plotW + 5} y={y0 + g * laneH + 3} textAnchor="start">{val.toFixed(0)}</text>;
                  });
                })()}
                {/* stack-mode lane label */}
                {mode === "stack" && primary && (
                  <text className="axis-label" x={padL} y={y0 - 1} style={{ fontWeight: 600, fill: primary.color }}>{primary.name} · {LG_AXES[primary.axis].label}</text>
                )}
                {/* event lines */}
                {events.map((e, ei) => {
                  const x = padL + e.at * plotW;
                  return <line key={ei} className="event-line" x1={x} y1={y0} x2={x} y2={y0 + laneH} stroke={e.color} />;
                })}
              </g>
            );
          })}
          {/* event flags on top lane */}
          {events.map((e, ei) => {
            const x = padL + e.at * plotW;
            const Ic = e.icon;
            return (
              <g key={ei} className="event-flag" transform={`translate(${x}, 0)`}
                 onMouseEnter={() => setHover({ e, x })} onMouseLeave={() => setHover(null)}>
                <circle cx="0" cy="2" r="7" fill="var(--canvas-default)" stroke={e.color} strokeWidth="1.5" />
                <g transform="translate(-5, -3)" style={{ color: e.color }}><Ic s={10} /></g>
              </g>
            );
          })}
        </svg>
        {hover && (
          <div className="evt-pop" style={{ left: `min(${(hover.x / W) * 100}%, calc(100% - 210px))`, top: 14 }}>
            <div className="ep-t" style={{ color: hover.e.color }}><hover.e.icon s={12} /> {hover.e.label}</div>
            <div className="ep-m">{(hover.e.at * (days * 24)).toFixed(0)}h into window</div>
            <div className="ep-src"><span className="tag b-idle" style={{ fontSize: 10 }}>from {hover.e.src}</span></div>
          </div>
        )}
      </div>

      <div className="chart-xaxis">
        {xticks.map((t, i) => <span className="xt" key={i}>{t}</span>)}
      </div>

      <div className="chart-foot">
        {showNight && <span className="cf-item"><span className="cf-sw cf-hatch" /> Lights-off (00:00–06:00)</span>}
        {showTargets && <span className="cf-item"><span className="cf-sw" style={{ background: "var(--accent-muted)", border: "1px dashed var(--accent-fg)" }} /> Target band</span>}
        {showOOR && <span className="cf-item"><span className="cf-sw" style={{ background: "var(--danger-muted)" }} /> Out-of-range</span>}
        <span className="cf-item" style={{ marginLeft: "auto" }}>
          {LG_EVENT_TYPES.map((et) => (
            <button key={et.id} className={"copt" + (evtFilter[et.id] ? " on" : "")} style={{ marginLeft: 4 }} onClick={() => onToggleOpt("evt:" + et.id)} title={"from " + et.src}>
              <span className="swatch-sq" style={{ background: et.color }} /> {et.label}
            </button>
          ))}
        </span>
      </div>
    </div>
  );
}

function MetricRow({ m, on, onToggle }) {
  const st = seriesStats(m.data);
  const [lo, hi] = niceBounds(st.min, st.max);
  return (
    <div className={"metric-row " + (on ? "on" : "off")} onClick={() => onToggle(m.id)}>
      <span className="mr-swatch" style={{ background: on ? m.color : "transparent", borderColor: on ? m.color : "var(--border-default)" }} />
      <div className="mr-info">
        <div className="mr-name">{m.name}{m.group === "derived" && <span className="mr-deriv">derived</span>}</div>
        <div className="mr-val">{m.value} {m.unit}</div>
      </div>
      <svg className="mr-spark" viewBox="0 0 46 18" preserveAspectRatio="none">
        <path d={pathFor(m.data.slice(-24), 1, 44, 1, 16, lo, hi)} fill="none" stroke={on ? m.color : "var(--fg-subtle)"} strokeWidth="1.2" vectorEffect="non-scaling-stroke" />
      </svg>
      <span className="mr-eye">{on ? <IcoEye s={15} /> : <IcoEyeOff s={15} />}</span>
    </div>
  );
}

          <div className="se-actions">
            <button className="btn primary" onClick={onGoSettings}><IcoRadar s={14} /> Connect sensors</button>
            <button className="btn" onClick={onGoSettings}><IcoGear s={14} /> Open Settings</button>

function LoggingPage({ empty, onGoSettings }) {
  const [visible, setVisible] = useState({ temp: true, rh: true, vpd: true, co2: false, soil: false, ppfd: false, dli: false });
  const [mode, setMode] = useState("overlay");
  const [range, setRange] = useState("24h");
  const [opts, setOpts] = useState({ night: true, targets: true, oor: true });
  const [evtFilter, setEvtFilter] = useState({ stage: true, mode: true, failsafe: true, milestone: true, device: true });
  const [layouts, setLayouts] = useState(LG_LAYOUTS_INIT);
  const [activeLayout, setActiveLayout] = useState("climate");
  const [saving, setSaving] = useState(false);
  const [layoutName, setLayoutName] = useState("");

  if (empty) {
    return (
      <>
        <div className="content-header">
          <div className="ch-titles">
            <div className="ch-crumb">Tent 1 <span className="sep">/</span> Not configured</div>
            <div className="ch-title">Logging <span className="tag b-idle"><span className="online-dot off" style={{ width: 7, height: 7 }} /> No sensors</span></div>
          </div>
          <div className="ch-actions"><button className="btn primary" onClick={onGoSettings}><IcoPlus s={14} /> Connect sensors</button></div>
        </div>
        <LoggingEmpty onGoSettings={onGoSettings} />
      </>
    );
  }

  const visMetrics = LG_METRICS.filter((m) => visible[m.id]);
  const toggle = (id) => { setVisible((p) => ({ ...p, [id]: !p[id] })); setActiveLayout(null); };
  const applyLayout = (l) => { const v = {}; LG_METRICS.forEach((m) => { v[m.id] = l.metrics.includes(m.id); }); setVisible(v); setActiveLayout(l.id); };
  const toggleOpt = (k) => {
    if (k.startsWith("evt:")) { const id = k.slice(4); setEvtFilter((p) => ({ ...p, [id]: !p[id] })); }
    else setOpts((p) => ({ ...p, [k]: !p[k] }));
  };
  const saveLayout = () => {
    if (!layoutName.trim()) return;
    const id = "l" + Date.now();
    setLayouts((p) => [...p, { id, name: layoutName, metrics: visMetrics.map((m) => m.id) }]);
    setActiveLayout(id); setLayoutName(""); setSaving(false);
  };
  const delLayout = (id, e) => { e.stopPropagation(); setLayouts((p) => p.filter((l) => l.id !== id)); if (activeLayout === id) setActiveLayout(null); };

  return (
    <>
      <div className="content-header">
        <div className="ch-titles">
          <div className="ch-crumb">Tent 1 <span className="sep">/</span> Northern Lights · Day 24 <span className="sep">/</span> Logging</div>
          <div className="ch-title">Logging <span className="tag b-info">{visMetrics.length} metric{visMetrics.length !== 1 ? "s" : ""} · {range}</span></div>
        </div>
        <div className="ch-actions">
          <button className="btn"><IcoDownload s={14} /> CSV</button>
          <button className="btn"><IcoDownload s={14} /> PNG</button>
        </div>
      </div>

      <div className="scroll">
        <div className="canvas-pad">
          {/* toolbar */}
          <div className="chart-toolbar">
            <div className="segmented">
              {LG_RANGES.map((r) => <button key={r} className={range === r ? "on" : ""} onClick={() => setRange(r)}>{r}</button>)}
            </div>
            <div className="seg-mode">
              <button className={mode === "overlay" ? "on" : ""} onClick={() => setMode("overlay")}><IcoOverlay s={13} /> Overlay</button>
              <button className={mode === "stack" ? "on" : ""} onClick={() => setMode("stack")}><IcoStack s={13} /> Stack</button>
            </div>
            <div className="ct-spacer" />
            <div className="layout-tabs">
              {layouts.map((l) => (
                <button key={l.id} className={"layout-chip" + (activeLayout === l.id ? " on" : "")} onClick={() => applyLayout(l)}>
                  <IcoBookmark s={11} /> {l.name}
                  <span className="lc-x" onClick={(e) => delLayout(l.id, e)}><IcoX s={10} /></span>
                </button>
              ))}
              <button className="layout-add" title="Save current as layout" onClick={() => setSaving((s) => !s)}><IcoPlus s={13} /></button>
            </div>
          </div>

          {saving && (
            <div className="save-layout-row">
              <IcoBookmark s={14} style={{ color: "var(--fg-muted)" }} />
              <input className="atext" autoFocus placeholder="Layout name (e.g. Climate, Root zone)…" value={layoutName} onChange={(e) => setLayoutName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveLayout()} />
              <span className="mr-val" style={{ marginRight: 4 }}>{visMetrics.length} metrics</span>
              <button className="btn primary sm" onClick={saveLayout}><IcoCheck s={13} /> Save layout</button>
              <button className="btn sm" onClick={() => { setSaving(false); setLayoutName(""); }}>Cancel</button>
            </div>
          )}

          {/* summary stat cards */}
          {visMetrics.length > 0 && (
            <div className="stat-strip">
              {visMetrics.map((m) => {
                const st = seriesStats(m.data);
                return (
                  <div className="stat-card" key={m.id}>
                    <div className="sc-top"><span className="sc-sw" style={{ background: m.color }} /><span className="sc-name">{m.name}</span>{m.group === "derived" && <span className="sc-deriv">deriv</span>}</div>
                    <div className="sc-stats">
                      <div className="sc-stat"><span className="sc-k">avg</span><span className="sc-v avg">{st.avg.toFixed(m.id === "vpd" || m.id === "dli" ? 1 : 0)}<small> {m.unit}</small></span></div>
                      <div className="sc-stat"><span className="sc-k">min</span><span className="sc-v" style={{ color: "var(--accent-fg)" }}>{st.min.toFixed(m.id === "vpd" || m.id === "dli" ? 1 : 0)}</span></div>
                      <div className="sc-stat"><span className="sc-k">max</span><span className="sc-v" style={{ color: "var(--danger-fg)" }}>{st.max.toFixed(m.id === "vpd" || m.id === "dli" ? 1 : 0)}</span></div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* main layout */}
          <div className="log-layout">
            <div className="metric-panel">
              <div className="mp-head"><IcoLogging s={13} /><h3>Metrics</h3><span className="mp-count">{visMetrics.length}/{LG_METRICS.length}</span></div>
              <div className="mp-group-l">Raw channels</div>
              {LG_METRICS.filter((m) => m.group === "raw").map((m) => <MetricRow key={m.id} m={m} on={visible[m.id]} onToggle={toggle} />)}
              <div className="mp-group-l">Derived</div>
              {LG_METRICS.filter((m) => m.group === "derived").map((m) => <MetricRow key={m.id} m={m} on={visible[m.id]} onToggle={toggle} />)}
              <div className="mp-foot"><span className="mr-val" style={{ color: "var(--fg-subtle)" }}>Axis grouping {mode === "overlay" ? "shares similar scales" : "one lane per metric"}</span></div>
            </div>

            <div className="chart-wrap">
              <ChartPanel metrics={visMetrics} mode={mode} range={range}
                showNight={opts.night} showTargets={opts.targets} showOOR={opts.oor}
                evtFilter={evtFilter} onToggleOpt={toggleOpt} />
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

// role → marker color + kind. sensors = blue-ish, controls = warm
const SV_ROLE_COLOR = {
  "canopy-temp": "#f78166", "canopy-rh": "#2f81f7", "rootzone": "#d29922", "co2-probe": "#3fb950",
  "res-temp": "#56d364", "exhaust": "#2f81f7", "intake": "#79c0ff", "circ": "#a371f7", "light": "#e3b341",
  "pump": "#56d364", "humidifier": "#2f81f7", "dehumidifier": "#a371f7", "co2-valve": "#3fb950", "heater": "#f85149",
};
const svColor = (d) => (d.role && SV_ROLE_COLOR[d.role]) || "#8b949e";
const svIcon = (d) => {
  const r = d.role;
  if (r === "light") return IcoSun;
  if (r === "exhaust" || r === "intake" || r === "circ") return IcoFan;
  if (r === "pump") return IcoWater;
  if (r === "co2-probe" || r === "co2-valve") return IcoCo2;
  if (r === "rootzone") return IcoSeedling;
  if (r === "humidifier" || r === "dehumidifier" || r === "canopy-rh") return IcoDrop;
  if (r === "heater" || r === "canopy-temp") return IcoTemp;
  return deviceKind(d) === "control" ? IcoPlug : IcoTarget;
};
// initial placements: {devId, x, y, z} — x/y in cm from front-left corner, z = mount height cm
const SV_DIMS_INIT = { w: 120, d: 120, h: 200 }; // cm (4x4 tent ~ 120cm, 2m tall)
const SV_PLACED_INIT = [
  { id: "shelly",  x: 60,  y: 60,  z: 195 },
  { id: "govee",   x: 95,  y: 30,  z: 120 },
  { id: "sonoff",  x: 105, y: 105, z: 180 },
  { id: "athom",   x: 20,  y: 95,  z: 110 },
  { id: "ecowitt", x: 40,  y: 45,  z: 5 },
  { id: "tapo",    x: 15,  y: 15,  z: 10 },
];

/* ============================================================
   SETUP VIEW — plan canvas
============================================================ */
function PlanCanvas({ dims, placed, devById, sel, onSelect, onMove, onDropDevice }) {
  const PAD = 34, VW = 560, VH = 460;
  const plotW = VW - PAD * 2, plotH = VH - PAD * 2;
  // scale: fit dims.w → plotW, dims.d → plotH, keep aspect
  const sc = Math.min(plotW / dims.w, plotH / dims.d);
  const boxW = dims.w * sc, boxH = dims.d * sc;
  const ox = PAD + (plotW - boxW) / 2, oy = PAD + (plotH - boxH) / 2;
  const toPx = (x, y) => [ox + x * sc, oy + y * sc];
  const toCm = (px, py) => [Math.round((px - ox) / sc), Math.round((py - oy) / sc)];
  const svgRef = React.useRef(null);
  const [drag, setDrag] = useState(null);
  const [dropping, setDropping] = useState(false);

  // grid every ~30cm
  const step = 30;
  const vlines = []; for (let cx = 0; cx <= dims.w; cx += step) vlines.push(cx);
  const hlines = []; for (let cy = 0; cy <= dims.d; cy += step) hlines.push(cy);

  const evtToCm = (e) => {
    const svg = svgRef.current; const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * VW;
    const py = (e.clientY - r.top) / r.height * VH;
    let [cx, cy] = toCm(px, py);
    cx = Math.max(0, Math.min(dims.w, cx)); cy = Math.max(0, Math.min(dims.d, cy));
    return [cx, cy];
  };
  const onPinDown = (e, id) => { e.stopPropagation(); onSelect(id); setDrag(id); };
  const onMoveSvg = (e) => { if (!drag) return; const [cx, cy] = evtToCm(e); onMove(drag, cx, cy); };
  const onUp = () => setDrag(null);

  return (
    <div className={"plan-canvas" + (dropping ? " drop-active" : "")}
      onDragOver={(e) => { e.preventDefault(); setDropping(true); }}
      onDragLeave={(e) => { if (e.currentTarget === e.target) setDropping(false); }}
      onDrop={(e) => { e.preventDefault(); setDropping(false); const id = e.dataTransfer.getData("text/devid"); if (id) { const [cx, cy] = evtToCm(e); onDropDevice(id, cx, cy); } }}>
      <div className="drop-hint"><span><IcoTarget s={15} /> Drop to place on plan</span></div>
      <div className="plan-stage">
        <svg ref={svgRef} className="plan-svg" viewBox={`0 0 ${VW} ${VH}`}
          onPointerMove={onMoveSvg} onPointerUp={onUp} onPointerLeave={onUp} onClick={() => onSelect(null)}>
          {/* grid */}
          {vlines.map((cx, i) => { const [x] = toPx(cx, 0); return <line key={"v"+i} className={cx % 60 === 0 ? "plan-grid-major" : "plan-grid-line"} x1={x} y1={oy} x2={x} y2={oy + boxH} />; })}
          {hlines.map((cy, i) => { const [, y] = toPx(0, cy); return <line key={"h"+i} className={cy % 60 === 0 ? "plan-grid-major" : "plan-grid-line"} x1={ox} y1={y} x2={ox + boxW} y2={y} />; })}
          {/* enclosure wall */}
          <rect className="plan-wall" x={ox} y={oy} width={boxW} height={boxH} rx="3" fillOpacity="0" />
          {/* door indicator on front (bottom) edge */}
          <path className="plan-door" d={`M ${ox + boxW*0.3} ${oy+boxH} A ${boxW*0.4} ${boxW*0.4} 0 0 1 ${ox + boxW*0.7} ${oy+boxH}`} />
          <text className="plan-axis" x={ox + boxW/2} y={oy + boxH + 22} textAnchor="middle">front · access</text>
          {/* dim labels */}
          <text className="plan-dim-label" x={ox + boxW/2} y={oy - 12} textAnchor="middle">{dims.w} cm wide</text>
          <text className="plan-dim-label" x={ox - 12} y={oy + boxH/2} textAnchor="middle" transform={`rotate(-90 ${ox-12} ${oy+boxH/2})`}>{dims.d} cm deep</text>

          {/* device pins */}
          {placed.map((p) => {
            const d = devById(p.id); if (!d) return null;
            const [x, y] = toPx(p.x, p.y);
            const col = svColor(d); const Ic = svIcon(d);
            const isSel = sel === p.id;
            return (
              <g key={p.id} className={"pin" + (isSel ? " sel" : "")} transform={`translate(${x}, ${y})`}
                 onPointerDown={(e) => onPinDown(e, p.id)} onClick={(e) => e.stopPropagation()}>
                {isSel && <circle className="pin-ring" r="16" />}
                <circle className="pin-dot" r="11" fill={col} />
                <g transform="translate(-6.5, -6.5)" style={{ color: "#fff" }}><Ic s={13} /></g>
                <g transform="translate(15, -6)">
                  <rect className="pin-label-bg" x="-2" y="-9" width={d.name.length * 5.6 + 4} height="14" rx="3" />
                  <text className="pin-label" x="0" y="2">{d.name}</text>
                  <text className="pin-z" x="0" y="14">z {p.z}cm</text>
                </g>
              </g>
            );
          })}
        </svg>
      </div>
    </div>
  );
}

/* ============================================================
   SETUP VIEW — side panel rows + editor
============================================================ */
function PinEditor({ p, d, dims, onChange, onRemove, onClose }) {
  const col = svColor(d); const Ic = svIcon(d);
  const role = d.role ? roleById(d.role) : null;
  const clamp = (v, max) => Math.max(0, Math.min(max, isNaN(v) ? 0 : v));
  return (
    <div className="pin-editor">
      <div className="pe-head">
        <span className="pe-dot" style={{ background: col }}><Ic s={13} /></span>
        <span className="pe-name">{d.name}</span>
        <button className="icon-ghost2" onClick={onClose} title="Close"><IcoX s={13} /></button>
      </div>
      <div className="pe-grid">
        <div className="pe-field"><label>X · width</label><span className="pe-num"><input type="number" value={p.x} onChange={(e) => onChange(p.id, { x: clamp(+e.target.value, dims.w) })} /><span className="pu">cm</span></span></div>
        <div className="pe-field"><label>Y · depth</label><span className="pe-num"><input type="number" value={p.y} onChange={(e) => onChange(p.id, { y: clamp(+e.target.value, dims.d) })} /><span className="pu">cm</span></span></div>
        <div className="pe-field"><label>Z · height</label><span className="pe-num"><input type="number" value={p.z} onChange={(e) => onChange(p.id, { z: clamp(+e.target.value, dims.h) })} /><span className="pu">cm</span></span></div>
      </div>
      <div className="pe-role">
        <label>Assigned role</label>
        <select className="role-select" style={{ maxWidth: "none", width: "100%" }} value={d.role || ""} onChange={(e) => onChange(p.id, { role: e.target.value || null }, true)}>
          <option value="">Unassigned</option>
          {ROLES.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
        </select>
      </div>
      <div className="pe-foot">
        <span className="pr-meta">{role ? <>drives <b style={{ color: "var(--fg-default)" }}>{role.unlocks || role.name}</b></> : "no automation role"}</span>
        <span className="spacer" />
        <button className="btn ghost-danger sm" onClick={() => onRemove(p.id)}><IcoTrash s={13} /> Remove</button>
      </div>
    </div>
  );
}

function SetupViewEmpty({ onGoSettings, onDefine }) {
  return (
    <div className="scroll">
      <div className="canvas-pad">
        <div className="set-empty">
          <div className="se-ico"><IcoCube s={28} /></div>
          <h2>No grow space defined yet</h2>
          <p>Set up your physical enclosure to place devices in it. Define the tent or room dimensions — width, depth, and height — then drag your discovered devices onto the to-scale plan and give each a mounting height. The <b>3D view</b> renders this layout once it's defined.</p>
          <div className="se-actions">
            <button className="btn primary" onClick={onDefine}><IcoRuler2 s={14} /> Define space &amp; place devices</button>
            <button className="btn" onClick={onGoSettings}><IcoGear s={14} /> Manage devices</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SetupViewPage({ empty, onGoSettings }) {
  const [defined, setDefined] = useState(!empty);
  const [mode, setMode] = useState("layout");
  const [dims, setDims] = useState(SV_DIMS_INIT);
  const [placed, setPlaced] = useState(SV_PLACED_INIT);
  const [roleOverride, setRoleOverride] = useState({});
  const [sel, setSel] = useState(null);

  const devById = (id) => { const base = CONFIGURED_DEVICES.find((d) => d.id === id); if (!base) return null; return roleOverride[id] !== undefined ? { ...base, role: roleOverride[id] } : base; };
  const placedIds = placed.map((p) => p.id);
  const available = CONFIGURED_DEVICES.filter((d) => !placedIds.includes(d.id));
  const selPin = placed.find((p) => p.id === sel);

  const setDim = (k, v) => setDims((p) => ({ ...p, [k]: Math.max(30, Math.min(600, isNaN(v) ? p[k] : v)) }));
  const move = (id, x, y) => setPlaced((p) => p.map((q) => q.id === id ? { ...q, x, y } : q));
  const change = (id, patch, isRole) => {
    if (isRole) { setRoleOverride((o) => ({ ...o, [id]: patch.role })); return; }
    setPlaced((p) => p.map((q) => q.id === id ? { ...q, ...patch } : q));
  };
  const remove = (id) => { setPlaced((p) => p.filter((q) => q.id !== id)); if (sel === id) setSel(null); };
  const place = (id, x = Math.round(dims.w / 2), y = Math.round(dims.d / 2)) => {
    if (placedIds.includes(id)) return;
    setPlaced((p) => [...p, { id, x, y, z: 100 }]); setSel(id);
  };

  if (empty && !defined) {
    return (
      <>
        <div className="content-header">
          <div className="ch-titles">
            <div className="ch-crumb">Tent 1 <span className="sep">/</span> Not configured</div>
            <div className="ch-title">Setup View <span className="tag b-idle"><span className="online-dot off" style={{ width: 7, height: 7 }} /> No space</span></div>
          </div>
          <div className="ch-actions"><button className="btn primary" onClick={() => setDefined(true)}><IcoPlus s={14} /> Define space</button></div>
        </div>
        <SetupViewEmpty onGoSettings={onGoSettings} onDefine={() => setDefined(true)} />
      </>
    );
  }

  const volume = (dims.w * dims.d * dims.h / 1e6).toFixed(2);
  const footprint = (dims.w * dims.d / 1e4).toFixed(2);

  return (
    <>
      <div className="content-header">
        <div className="ch-titles">
          <div className="ch-crumb">Tent 1 <span className="sep">/</span> Northern Lights · Day 24 <span className="sep">/</span> Setup View</div>
          <div className="ch-title">Setup View <span className="tag b-info">{placed.length} device{placed.length !== 1 ? "s" : ""} placed</span></div>
        </div>
        <div className="ch-actions">
          <div className="sv-modes">
            <button className={mode === "layout" ? "on" : ""} onClick={() => setMode("layout")}><IcoMap s={13} /> Layout</button>
            <button className={mode === "3d" ? "on" : ""} onClick={() => setMode("3d")}><IcoCube s={13} /> 3D view</button>
          </div>
        </div>
      </div>

      <div className="scroll">
        <div className="canvas-pad">
          {/* dimension bar */}
          <div className="dim-bar">
            <span className="dim-title"><IcoCube s={15} /> Enclosure</span>
            <div className="dim-fields">
              <div className="dim-field"><label>W</label><span className="dim-input"><input type="number" value={dims.w} onChange={(e) => setDim("w", +e.target.value)} /><span className="du">cm</span></span></div>
              <span className="dim-x">×</span>
              <div className="dim-field"><label>D</label><span className="dim-input"><input type="number" value={dims.d} onChange={(e) => setDim("d", +e.target.value)} /><span className="du">cm</span></span></div>
              <span className="dim-x">×</span>
              <div className="dim-field"><label>H</label><span className="dim-input"><input type="number" value={dims.h} onChange={(e) => setDim("h", +e.target.value)} /><span className="du">cm</span></span></div>
            </div>
            <div className="dim-meta">
              <span>footprint <b>{footprint} m²</b></span>
              <span>volume <b>{volume} m³</b></span>
            </div>
          </div>

          {mode === "3d" ? (
            <div className="plan-box">
              <div className="set-empty" style={{ margin: 0, padding: "60px 40px" }}>
                <div className="se-ico"><IcoCube s={28} /></div>
                <h2>3D view</h2>
                <p>The semi-3D render of this layout is designed separately. Your <b>{dims.w}×{dims.d}×{dims.h} cm</b> enclosure and {placed.length} placed devices will render here. Switch back to <b>Layout</b> to edit placements.</p>
                <div className="se-actions"><button className="btn" onClick={() => setMode("layout")}><IcoMap s={14} /> Back to Layout</button></div>
              </div>
            </div>
          ) : (
            <div className="sv-layout">
              {/* plan */}
              <div className="plan-box">
                <div className="plan-head">
                  <IcoMap s={14} /><h3>Top-down plan</h3>
                  <span className="ph-hint"><IcoMove s={12} /> drag pins to move · drag devices in from the right</span>
                </div>
                <PlanCanvas dims={dims} placed={placed} devById={devById} sel={sel}
                  onSelect={setSel} onMove={move} onDropDevice={(id, x, y) => place(id, x, y)} />
                <div className="plan-foot">
                  <span className="plan-legend"><span className="pl-dot" style={{ background: "#f78166" }} /> Sensor</span>
                  <span className="plan-legend"><span className="pl-dot" style={{ background: "#2f81f7" }} /> Climate</span>
                  <span className="plan-legend"><span className="pl-dot" style={{ background: "#e3b341" }} /> Light</span>
                  <span className="plan-legend"><span className="pl-dot" style={{ background: "#56d364" }} /> Water</span>
                  <span className="pf-scale"><IcoRuler2 s={12} /> grid = 30 cm</span>
                </div>
              </div>

              {/* side */}
              <div className="sv-side">
                <div className="sv-panel">
                  <div className="svp-head"><IcoLayers s={13} /><h3>Placed</h3><span className="svp-count">{placed.length}</span></div>
                  {placed.length === 0 && <div className="avail-empty">No devices placed yet.<br/>Drag one from below onto the plan.</div>}
                  {placed.map((p) => {
                    const d = devById(p.id); if (!d) return null;
                    const Ic = svIcon(d); const role = d.role ? roleById(d.role) : null;
                    return (
                      <React.Fragment key={p.id}>
                        <div className={"placed-row" + (sel === p.id ? " sel" : "")} onClick={() => setSel(sel === p.id ? null : p.id)}>
                          <span className="pr-dot" style={{ background: svColor(d) }}><Ic s={12} /></span>
                          <div className="pr-info">
                            <div className="pr-name">{d.name}</div>
                            <div className="pr-meta">{role ? role.name : "unassigned"} · {p.x},{p.y}</div>
                          </div>
                          <span className="pr-z"><IcoLayers s={11} /> {p.z}cm</span>
                        </div>
                        {sel === p.id && selPin && <PinEditor p={selPin} d={d} dims={dims} onChange={change} onRemove={remove} onClose={() => setSel(null)} />}
                      </React.Fragment>
                    );
                  })}
                </div>

                <div className="sv-panel">
                  <div className="svp-head"><IcoPlug s={13} /><h3>Available</h3><span className="svp-count">{available.length}</span></div>
                  {available.length === 0 && <div className="avail-empty">All discovered devices are placed.</div>}
                  {available.map((d) => {
                    const Ic = svIcon(d);
                    return (
                      <div key={d.id} className="avail-row" draggable
                        onDragStart={(e) => { e.dataTransfer.setData("text/devid", d.id); e.dataTransfer.effectAllowed = "copy"; }}>
                        <span className="ar-grip"><IcoDots s={13} /></span>
                        <span className="ar-kind" style={{ background: svColor(d) }}><Ic s={12} /></span>
                        <div className="ar-i">
                          <div className="ar-n">{d.name}{!d.online && <span className="tag b-idle" style={{ fontSize: 9, marginLeft: 5 }}>offline</span>}</div>
                          <div className="ar-m">{d.model}</div>
                        </div>
                        <button className="ar-add" title="Place on plan" onClick={() => place(d.id)}><IcoPlus s={13} /></button>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

/* ============================================================
   SHELL
============================================================ */
function App({ initialSection = "overview", settingsSeed, overviewEmpty = false, automationEmpty = false, growSetup = false, growCompleted = false, journalTab = "current", maintenanceTab = "today", maintenanceEmpty = false, loggingEmpty = false, setupEmpty = false } = {}) {
  const [active, setActive] = useState(initialSection);
  const SETTINGS_SEED = settingsSeed || { devices: CONFIGURED_DEVICES, scan: "done" };
  const [range, setRange] = useState("24H");
  const [tick, setTick] = useState(0);
  const lastSync = useMemo(() => (tick === 0 ? "12s ago" : "just now"), [tick]);

  const groups = useMemo(() => {
    const order = ["Monitor", "Manage", "Service", "Config"];
    const map = {};
    NAV.forEach((n) => { (map[n.group] = map[n.group] || []).push(n); });
    return order.map((g) => ({ group: g, items: map[g] }));
  }, []);

  const activeItem = NAV.find((n) => n.id === active);

  return (
    <div className="app">
      {/* TITLEBAR */}
      <div className="titlebar">
        <div className="traffic"><span className="r" /><span className="y" /><span className="g" /></div>
        <div className="tb-brand">
          <span className="mark"><IcoLeaf s={13} /></span>
          Canopy
        </div>
        <div className="tb-spacer" />
        <div className="cmdk">
          <IcoSearch s={14} />
          <span>Search sensors, automations, logs…</span>
          <span className="kbd">⌘K</span>
        </div>
        <button className="tb-icon-btn" title="Notifications"><IcoBell s={16} /></button>
        <button className="tb-icon-btn" title="Settings"><IcoGear s={16} /></button>
        <div className="tb-avatar">GA</div>
      </div>

      <div className="body">
        {/* SIDEBAR */}
        <aside className="sidebar">
          <div className="workspace">
            <div className="ws-ico"><IcoSeedling s={16} /></div>
            <div className="ws-meta">
              <div className="ws-name">Tent 1 — Veg</div>
              <div className="ws-sub"><span className="dot-live" style={{ width: 6, height: 6, boxShadow: "none" }} /> 5 sensors · 8 devices</div>
            </div>
            <span className="chev"><IcoChevron s={14} /></span>
          </div>

          <nav className="nav">
            {groups.map((g) => (
              <div key={g.group}>
                <div className="nav-group-label">{g.group}</div>
                {g.items.map((n) => {
                  const Icon = n.icon;
                  return (
                    <button key={n.id} className={`nav-item ${active === n.id ? "active" : ""}`} onClick={() => setActive(n.id)}>
                      <span className="ni-ico"><Icon s={16} /></span>
                      {n.label}
                      {n.count != null && <span className="ni-count">{n.count}</span>}
                    </button>
                  );
                })}
              </div>
            ))}
          </nav>

          <div className="sb-footer">
            <span className="dot-live" />
            <span>Controller online</span>
            <span className="gear" title="Connection"><IcoExternal s={14} /></span>
          </div>
        </aside>

        {/* MAIN */}
        <main className="main">
          {active === "overview"
            ? <Overview range={range} onRange={setRange} lastSync={lastSync} onRefresh={() => setTick((t) => t + 1)} empty={overviewEmpty} onGoSettings={() => setActive("settings")} />
            : active === "settings"
            ? <SettingsPage seed={SETTINGS_SEED} />
            : active === "automation"
            ? <AutomationPage empty={automationEmpty} onGoSettings={() => setActive("settings")} />
            : active === "growcycle"
            ? <GrowCyclePage setup={growSetup} completed={growCompleted} onGoAutomation={() => setActive("automation")} onGoJournal={() => setActive("journal")} />
            : active === "journal"
            ? <JournalPage initialTab={journalTab} onGoGrow={() => setActive("growcycle")} />
            : active === "maintenance"
            ? <MaintenancePage initialTab={maintenanceTab} empty={maintenanceEmpty} onGoSettings={() => setActive("settings")} />
            : active === "logging"
            ? <LoggingPage empty={loggingEmpty} onGoSettings={() => setActive("settings")} />
            : active === "setup"
            ? <SetupViewPage empty={setupEmpty} onGoSettings={() => setActive("settings")} />
            : <Placeholder item={activeItem} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App initialSection="setup" />);

</script>
</body>
</html>
