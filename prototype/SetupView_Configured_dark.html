<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setup View · Configured · dark</title>
<style>
:root {
  color-scheme: dark;
  /* Primer dark — canvas */
  --canvas-default: #0d1117;
  --canvas-inset: #010409;
  --canvas-subtle: #161b22;
  --canvas-overlay: #161b22;
  --canvas-hover: #1c2128;
  /* borders */
  --border-default: #30363d;
  --border-muted: #21262d;
  /* foreground */
  --fg-default: #e6edf3;
  --fg-muted: #8b949e;
  --fg-subtle: #6e7681;
  /* roles */
  --accent-fg: #2f81f7;
  --accent-emphasis: #1f6feb;
  --accent-muted: rgba(56,139,253,0.15);
  --success-fg: #3fb950;
  --success-emphasis: #238636;
  --success-muted: rgba(46,160,67,0.15);
  --attention-fg: #d29922;
  --attention-muted: rgba(187,128,9,0.15);
  --danger-fg: #f85149;
  --danger-muted: rgba(248,81,73,0.15);
  --done-fg: #a371f7;
  --done-muted: rgba(163,113,247,0.15);
  /* btn */
  --btn-bg: #21262d;
  --btn-hover: #30363d;
  --btn-border: rgba(240,246,252,0.1);
  --shadow-sm: 0 1px 0 rgba(1,4,9,0.1);

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--fg-default);
  background: var(--canvas-inset);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#root { height: 100vh; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 6px; border: 2px solid var(--canvas-default); }
::-webkit-scrollbar-thumb:hover { background: #484f58; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ APP FRAME ============ */
.app { display: flex; flex-direction: column; height: 100vh; background: var(--canvas-default); }

/* titlebar */
.titlebar {
  height: 44px; flex: 0 0 44px;
  display: flex; align-items: center; gap: 12px;
  padding: 0 12px;
  background: var(--canvas-subtle);
  border-bottom: 1px solid var(--border-default);
  -webkit-app-region: drag;
  user-select: none;
}
.traffic { display: flex; gap: 8px; padding-right: 4px; }
.traffic span { width: 12px; height: 12px; border-radius: 50%; display: block; }
.traffic .r { background: #ff5f57; }
.traffic .y { background: #febc2e; }
.traffic .g { background: #28c840; }
.tb-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; letter-spacing: -0.1px; }
.tb-brand .mark {
  width: 20px; height: 20px; border-radius: 5px;
  background: linear-gradient(160deg, #2ea043, #238636);
  display: grid; place-items: center; color: #fff;
}
.tb-brand .mark svg { width: 13px; height: 13px; }
.tb-spacer { flex: 1; }
.cmdk {
  -webkit-app-region: no-drag;
  display: flex; align-items: center; gap: 8px;
  height: 28px; width: 320px; max-width: 34vw;
  padding: 0 8px 0 10px;
  background: var(--canvas-inset);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  color: var(--fg-subtle); font-size: 13px;
  cursor: text;
}
.cmdk:hover { border-color: var(--fg-subtle); }
.cmdk .kbd {
  margin-left: auto;
  font-family: var(--mono); font-size: 11px;
  color: var(--fg-muted);
  border: 1px solid var(--border-default); border-radius: 4px;
  padding: 1px 5px; background: var(--canvas-subtle);
}
.tb-icon-btn {
  -webkit-app-region: no-drag;
  width: 30px; height: 28px; display: grid; place-items: center;
  border: 1px solid transparent; border-radius: 6px;
  color: var(--fg-muted); background: transparent; cursor: pointer;
}
.tb-icon-btn:hover { background: var(--canvas-inset); color: var(--fg-default); }
.tb-avatar {
  -webkit-app-region: no-drag;
  width: 24px; height: 24px; border-radius: 50%;
  background: linear-gradient(150deg,#6e40c9,#3081f7);
  display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 600;
  cursor: pointer;
}

/* body split */
.body { display: flex; flex: 1; min-height: 0; }

/* ============ SIDEBAR ============ */
.sidebar {
  width: 248px; flex: 0 0 248px;
  background: var(--canvas-inset);
  border-right: 1px solid var(--border-default);
  display: flex; flex-direction: column;
  min-height: 0;
}
.workspace {
  margin: 12px 12px 4px;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--border-default);
  border-radius: 6px; cursor: pointer;
  background: var(--canvas-default);
}
.workspace:hover { border-color: var(--fg-subtle); }
.workspace .ws-ico {
  width: 28px; height: 28px; border-radius: 6px; flex: 0 0 28px;
  background: var(--success-muted); color: var(--success-fg);
  display: grid; place-items: center;
}
.workspace .ws-meta { min-width: 0; flex: 1; }
.workspace .ws-name { font-weight: 600; font-size: 13px; line-height: 1.3; }
.workspace .ws-sub { font-size: 11px; color: var(--fg-muted); display: flex; align-items: center; gap: 5px; }
.workspace .chev { color: var(--fg-muted); }

.nav { padding: 8px; overflow-y: auto; flex: 1; }
.nav-group-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--fg-subtle);
  padding: 12px 10px 4px;
}
.nav-item {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  padding: 7px 10px; margin: 1px 0;
  border-radius: 6px; border: 1px solid transparent;
  background: transparent; cursor: pointer;
  color: var(--fg-muted); font-size: 14px; font-weight: 500;
  font-family: var(--sans);
}
.nav-item:hover { background: var(--canvas-subtle); color: var(--fg-default); }
.nav-item .ni-ico { width: 16px; height: 16px; flex: 0 0 16px; display: grid; place-items: center; color: var(--fg-muted); }
.nav-item:hover .ni-ico { color: var(--fg-default); }
.nav-item .ni-count {
  margin-left: auto; font-size: 11px; font-family: var(--mono);
  color: var(--fg-muted); background: var(--canvas-subtle);
  border: 1px solid var(--border-muted); border-radius: 20px; padding: 0 7px; line-height: 18px;
}
.nav-item.active { background: var(--canvas-subtle); color: var(--fg-default); font-weight: 600; }
.nav-item.active .ni-ico { color: var(--fg-default); }
.nav-item.active::before {
  content: ""; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 22px; border-radius: 0 4px 4px 0; background: #f78166;
}

.sb-footer {
  border-top: 1px solid var(--border-default);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--fg-muted);
}
.dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--success-fg); box-shadow: 0 0 0 3px var(--success-muted); flex: 0 0 8px; }
.sb-footer .gear { margin-left: auto; color: var(--fg-muted); cursor: pointer; display: grid; place-items: center; }
.sb-footer .gear:hover { color: var(--fg-default); }
@keyframes pulse { 0%,100%{ opacity: 1; } 50% { opacity: 0.4; } }
.dot-live { animation: pulse 2.4s ease-in-out infinite; }

/* ============ MAIN ============ */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--canvas-default); }
.content-header {
  flex: 0 0 auto;
  padding: 20px 28px 16px;
  border-bottom: 1px solid var(--border-default);
  display: flex; align-items: flex-end; gap: 16px;
}
.ch-titles { flex: 1; min-width: 0; }
.ch-crumb { font-size: 12px; color: var(--fg-muted); display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.ch-crumb .sep { color: var(--fg-subtle); }
.ch-title { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; }
.ch-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

/* segmented */
.segmented { display: inline-flex; border: 1px solid var(--border-default); border-radius: 6px; overflow: hidden; background: var(--canvas-default); }
.segmented button {
  font-family: var(--mono); font-size: 12px; color: var(--fg-muted);
  background: transparent; border: none; padding: 5px 11px; cursor: pointer;
  border-left: 1px solid var(--border-default);
}
.segmented button:first-child { border-left: none; }
.segmented button:hover { color: var(--fg-default); background: var(--canvas-subtle); }
.segmented button.on { color: var(--fg-default); background: var(--canvas-subtle); font-weight: 600; }

.btn {
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  font-family: var(--sans); font-size: 13px; font-weight: 600;
  color: var(--fg-default); background: var(--btn-bg);
  border: 1px solid var(--btn-border); border-radius: 6px;
  padding: 5px 12px; cursor: pointer; line-height: 20px;
}
.btn:hover { background: var(--btn-hover); border-color: var(--fg-subtle); }
.btn svg { color: var(--fg-muted); }
.btn.primary { background: var(--success-emphasis); border-color: rgba(240,246,252,0.1); color: #fff; }
.btn.primary:hover { background: #2ea043; }
.btn.primary svg { color: #fff; }
.btn-icon { padding: 6px; }

.scroll { overflow-y: auto; flex: 1; }
.canvas-pad { padding: 24px 28px 48px; max-width: 1320px; }

/* section heading inside content */
.sec-head { display: flex; align-items: center; gap: 10px; margin: 26px 0 12px; }
.sec-head:first-child { margin-top: 0; }
.sec-head h2 { font-size: 14px; font-weight: 600; color: var(--fg-default); }
.sec-head .count { font-size: 12px; color: var(--fg-muted); font-family: var(--mono); }
.sec-head .rule { flex: 1; height: 1px; background: var(--border-muted); }
.sec-head .link { font-size: 12px; color: var(--accent-fg); cursor: pointer; }
.sec-head .link:hover { text-decoration: underline; }

/* ============ SENSOR CARDS ============ */
.sensor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
.s-card {
  border: 1px solid var(--border-default); border-radius: 8px;
  background: var(--canvas-default); padding: 14px 14px 12px;
  display: flex; flex-direction: column; gap: 10px;
  transition: border-color .12s ease;
}
.s-card:hover { border-color: var(--fg-subtle); }
.s-top { display: flex; align-items: center; gap: 8px; }
.s-ico { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; flex: 0 0 26px; }
.s-label { font-size: 12px; color: var(--fg-muted); font-weight: 500; flex: 1; }
.s-status { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
.s-valrow { display: flex; align-items: baseline; gap: 5px; }
.s-val { font-size: 28px; font-weight: 600; letter-spacing: -0.6px; font-feature-settings: "tnum"; line-height: 1; }
.s-unit { font-size: 13px; color: var(--fg-muted); font-weight: 500; }
.s-delta { margin-left: auto; font-size: 12px; font-family: var(--mono); display: flex; align-items: center; gap: 3px; }
.s-delta.up { color: var(--success-fg); }
.s-delta.down { color: var(--danger-fg); }
.s-delta.flat { color: var(--fg-muted); }
.s-spark { height: 30px; }
.s-foot { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); }
.s-target { display: flex; align-items: center; gap: 5px; }
.s-badge { font-size: 10px; font-weight: 600; letter-spacing: 0.02em; padding: 1px 6px; border-radius: 20px; text-transform: uppercase; font-family: var(--sans); }

/* ============ TWO-COL ============ */
.two-col { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 1080px) { .two-col { grid-template-columns: 1fr; } }

.box { border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); overflow: hidden; }
.box-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border-default); background: var(--canvas-subtle); }
.box-head h3 { font-size: 13px; font-weight: 600; }
.box-head .count { font-size: 11px; color: var(--fg-muted); font-family: var(--mono); border: 1px solid var(--border-muted); border-radius: 20px; padding: 0 7px; }
.box-head .h-link { margin-left: auto; font-size: 12px; color: var(--accent-fg); cursor: pointer; }
.box-head .h-link:hover { text-decoration: underline; }

/* activity feed */
.feed { padding: 4px 0; }
.feed-row { display: flex; gap: 12px; padding: 9px 16px; position: relative; }
.feed-row:hover { background: var(--canvas-subtle); }
.feed-ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 26px; border: 1px solid var(--border-default); background: var(--canvas-default); }
.feed-body { flex: 1; min-width: 0; }
.feed-text { font-size: 13px; color: var(--fg-default); }
.feed-text b { font-weight: 600; }
.feed-text .src { color: var(--accent-fg); }
.feed-meta { font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); margin-top: 1px; display: flex; gap: 8px; }
.feed-time { font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); white-space: nowrap; flex: 0 0 auto; padding-top: 1px; }

/* automations list */
.auto-list { display: flex; flex-direction: column; }
.auto-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-muted); }
.auto-row:last-child { border-bottom: none; }
.auto-ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; flex: 0 0 30px; background: var(--canvas-subtle); border: 1px solid var(--border-default); color: var(--fg-muted); }
.auto-meta { flex: 1; min-width: 0; }
.auto-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.auto-desc { font-size: 11px; color: var(--fg-muted); font-family: var(--mono); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggle {
  width: 38px; height: 22px; border-radius: 20px; flex: 0 0 38px;
  background: var(--canvas-subtle); border: 1px solid var(--border-default);
  position: relative; cursor: pointer; transition: background .15s, border-color .15s;
}
.toggle .knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-muted); transition: transform .15s, background .15s; }
.toggle.on { background: var(--success-emphasis); border-color: var(--success-emphasis); }
.toggle.on .knob { transform: translateX(16px); background: #fff; }

/* status badge variants */
.b-ok { background: var(--success-muted); color: var(--success-fg); }
.b-warn { background: var(--attention-muted); color: var(--attention-fg); }
.b-err { background: var(--danger-muted); color: var(--danger-fg); }
.b-idle { background: var(--canvas-subtle); color: var(--fg-muted); border: 1px solid var(--border-muted); }
.b-info { background: var(--accent-muted); color: var(--accent-fg); }

.tag { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 20px; font-family: var(--sans); display: inline-flex; align-items: center; gap: 4px; }

/* mini summary strip */
.summary-strip { display: flex; gap: 0; border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); overflow: hidden; margin-bottom: 4px; }
.summary-cell { flex: 1; padding: 13px 16px; border-left: 1px solid var(--border-muted); }
.summary-cell:first-child { border-left: none; }
.summary-cell .sc-label { font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.03em; }
.summary-cell .sc-val { font-size: 19px; font-weight: 600; margin-top: 3px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.3px; }
.summary-cell .sc-sub { font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); margin-top: 1px; }

/* empty state for unbuilt sections */
.empty { display: grid; place-items: center; height: 100%; padding: 60px; }
.empty-inner { text-align: center; max-width: 420px; }
.empty-ico { width: 64px; height: 64px; border-radius: 14px; background: var(--canvas-subtle); border: 1px solid var(--border-default); display: grid; place-items: center; margin: 0 auto 18px; color: var(--fg-muted); }
.empty h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.empty p { font-size: 14px; color: var(--fg-muted); margin-bottom: 18px; }
.empty .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-family: var(--mono); color: var(--fg-muted); border: 1px solid var(--border-default); border-radius: 20px; padding: 4px 12px; }
/* ============ SETTINGS ============ */
.conn-box { margin-bottom: 18px; }
.net-meta { margin-left: auto; font-size: 11.5px; color: var(--fg-muted); font-family: var(--mono); display: flex; align-items: center; gap: 6px; }
.net-meta .sep { color: var(--fg-subtle); }
.conn-grid { display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 880px) { .conn-grid { grid-template-columns: 1fr; } }
.conn-card { padding: 16px; display: flex; flex-direction: column; gap: 13px; align-items: flex-start; border-left: 1px solid var(--border-muted); }
.conn-card:first-child { border-left: none; }
@media (max-width: 880px) { .conn-card { border-left: none; border-top: 1px solid var(--border-muted); } .conn-card:first-child { border-top: none; } }
.cc-top { display: flex; gap: 11px; }
.cc-ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; flex: 0 0 30px; }
.cc-ico.blue { background: var(--accent-muted); color: var(--accent-fg); }
.cc-ico.green { background: var(--success-muted); color: var(--success-fg); }
.cc-title { font-size: 13px; font-weight: 600; }
.cc-desc { font-size: 12px; color: var(--fg-muted); margin-top: 2px; max-width: 36ch; line-height: 1.45; }
.cc-protos { display: flex; gap: 6px; }
.cc-actions { display: flex; gap: 8px; align-items: center; }
.proto-badge { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--fg-muted); background: var(--canvas-subtle); border: 1px solid var(--border-default); border-radius: 5px; padding: 1px 7px; }
.proto-badge.soft { color: var(--accent-fg); border-color: rgba(56,139,253,0.3); background: var(--accent-muted); }
.btn.ghost-danger { background: transparent; border-color: transparent; color: var(--fg-muted); padding: 5px 9px; }
.btn.ghost-danger:hover { background: var(--danger-muted); color: var(--danger-fg); border-color: transparent; }
.btn.ghost-danger svg { color: inherit; }

.spinner { width: 14px; height: 14px; border: 2px solid var(--border-default); border-top-color: var(--accent-fg); border-radius: 50%; animation: spin .7s linear infinite; flex: 0 0 14px; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.scan-panel { width: 100%; border: 1px solid var(--border-default); border-radius: 7px; background: var(--canvas-inset); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.scan-top { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--fg-default); font-family: var(--mono); }
.scan-top b { color: var(--accent-fg); font-weight: 600; }
.scan-protos { display: flex; gap: 8px; flex-wrap: wrap; }
.scan-proto { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--mono); color: var(--fg-muted); border: 1px solid var(--border-muted); border-radius: 20px; padding: 2px 9px; }
.scan-proto .sp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-fg); animation: pulse 1s ease-in-out infinite; }
.scan-proto .sp-tip { color: var(--fg-subtle); }
.scan-bar { height: 3px; border-radius: 3px; background: var(--border-muted); overflow: hidden; position: relative; }
.scan-bar i { position: absolute; left: -40%; width: 40%; height: 100%; background: var(--accent-fg); border-radius: 3px; animation: indet 1.1s ease-in-out infinite; }
@keyframes indet { 0% { left: -40%; } 100% { left: 100%; } }

.set-empty { border: 1px dashed var(--border-default); border-radius: 10px; background: var(--canvas-default); padding: 40px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.se-ico { width: 60px; height: 60px; border-radius: 14px; background: var(--accent-muted); color: var(--accent-fg); display: grid; place-items: center; margin-bottom: 16px; }
.set-empty h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.set-empty p { font-size: 13.5px; color: var(--fg-muted); max-width: 58ch; margin-bottom: 18px; line-height: 1.6; }
.se-actions { display: flex; gap: 10px; margin-bottom: 24px; }
.se-caps { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border-muted); padding-top: 18px; width: 100%; max-width: 580px; }
.se-cap { display: flex; align-items: center; gap: 7px; justify-content: center; flex-wrap: wrap; }
.se-cap-lbl { font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); margin-left: 6px; }

.callout { display: flex; gap: 13px; align-items: center; border: 1px solid rgba(187,128,9,0.3); background: rgba(187,128,9,0.08); border-radius: 8px; padding: 13px 15px; margin-bottom: 10px; }
.callout-ico { width: 30px; height: 30px; border-radius: 7px; flex: 0 0 30px; display: grid; place-items: center; background: var(--attention-muted); color: var(--attention-fg); }
.callout-body { flex: 1; min-width: 0; }

.modal { width: 440px; max-width: 92%; background: var(--canvas-overlay); border: 1px solid var(--border-default); border-radius: 12px; box-shadow: 0 16px 48px rgba(1,4,9,0.6); overflow: hidden; }

/* ============ AUTOMATION ============ */

/* ============ GROW CYCLE ============ */

.gc-list { border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden; background: var(--canvas-default); }
.gc-row { display: flex; align-items: center; gap: 13px; padding: 13px 16px; border-top: 1px solid var(--border-muted); }
.gc-row:first-child { border-top: none; }

.gc-dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 10px; }

.gc-stage-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 9px; }
.gc-mode-chip { font-size: 11px; font-weight: 600; font-family: var(--mono); color: var(--accent-fg); background: var(--accent-muted); border-radius: 5px; padding: 1px 7px; cursor: pointer; }

.gc-range { font-size: 11.5px; color: var(--fg-muted); font-family: var(--mono); margin-top: 2px; }
.gc-status { flex: 0 0 auto; }
.gc-stepper { display: flex; align-items: center; border: 1px solid var(--border-default); border-radius: 7px; overflow: hidden; background: var(--canvas-default); flex: 0 0 auto; }

@media (max-width: 900px) { .gc-range { display: none; } }

/* ============ LIFECYCLE: ABORT / ARCHIVE ============ */
.abort-panel { border: 1px solid rgba(248,81,73,0.4); background: var(--danger-muted); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }

.reason-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.reason { font-size: 12.5px; font-weight: 500; color: var(--fg-default); background: var(--canvas-default); border: 1px solid var(--border-default); border-radius: 20px; padding: 5px 12px; cursor: pointer; font-family: var(--sans); }
.reason:hover { border-color: var(--danger-fg); }
.reason.on { background: var(--danger-fg); color: #fff; border-color: var(--danger-fg); }
.abort-note { width: 100%; background: var(--canvas-default); border: 1px solid var(--border-default); border-radius: 6px; color: var(--fg-default); font-size: 13px; padding: 8px 10px; font-family: var(--sans); margin-bottom: 11px; }
.abort-note:focus { outline: none; border-color: var(--danger-fg); }
.abort-foot { display: flex; align-items: center; }
.abort-foot .spacer { flex: 1; }
.btn.danger { background: #da3633; color: #fff; border-color: rgba(240,246,252,0.1); }
.btn.danger:hover { background: #b62324; }
.btn.danger svg { color: #fff; }
.btn.danger:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary.ok { background: var(--success-fg); }
.archived-banner { display: flex; align-items: center; gap: 10px; border: 1px solid rgba(46,160,67,0.4); background: var(--success-muted); border-radius: 8px; padding: 11px 14px; margin-bottom: 16px; font-size: 13px; color: var(--fg-default); }
.archived-banner svg { color: var(--success-fg); flex: 0 0 auto; }
.archived-banner > div { flex: 1; }

/* ============ HARVEST / REPORT ============ */
.harvest-box { padding: 16px; }
.harvest-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border-muted); }

.hv-field { display: flex; flex-direction: column; gap: 7px; }
.hv-field > label { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--fg-muted); font-weight: 600; }
.hv-input { display: flex; align-items: center; border: 1px solid var(--border-default); border-radius: 7px; background: var(--canvas-inset); overflow: hidden; }
.hv-input input { flex: 1; min-width: 0; background: transparent; border: none; color: var(--fg-default); font-size: 18px; font-weight: 600; padding: 7px 10px; font-variant-numeric: tabular-nums; }
.hv-input input:focus { outline: none; }
.hv-unit { padding: 0 11px; color: var(--fg-muted); font-size: 13px; border-left: 1px solid var(--border-default); align-self: stretch; display: flex; align-items: center; }
.hv-ratio { font-size: 22px; font-weight: 600; color: var(--success-fg); padding: 4px 0; }
.stars { display: flex; align-items: center; gap: 3px; }
.star { background: none; border: none; cursor: pointer; color: var(--border-default); padding: 0; display: grid; place-items: center; }
.star.on, .star:hover { color: #e3b341; }
.stars-val { margin-left: 7px; font-size: 14px; font-weight: 600; color: var(--fg-default); font-variant-numeric: tabular-nums; }
.harvest-notes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding-top: 16px; }
@media (max-width: 820px) { .harvest-notes { grid-template-columns: 1fr; } }
.hv-note { display: flex; flex-direction: column; gap: 7px; }
.hv-note > label { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--fg-muted); font-weight: 600; display: flex; align-items: center; gap: 5px; }
.hv-note textarea { min-height: 74px; resize: vertical; background: var(--canvas-inset); border: 1px solid var(--border-default); border-radius: 7px; color: var(--fg-default); font-size: 13px; padding: 9px 11px; font-family: var(--sans); line-height: 1.5; }
.hv-note textarea:focus { outline: none; border-color: var(--accent-emphasis); box-shadow: 0 0 0 3px var(--accent-muted); }
.report-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 980px) { .report-grid { grid-template-columns: 1fr; } }
.pva { padding: 6px 16px 12px; }
.pva-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-muted); }
.pva-row:last-child { border-bottom: none; }
.pva-name { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; width: 92px; flex: 0 0 92px; }
.pva-bars { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.pva-bar { position: relative; display: flex; align-items: center; gap: 7px; }
.pva-fill { height: 8px; border-radius: 3px; min-width: 3px; }
.pva-fill.planned { background: var(--border-default); }
.pva-bar span { font-size: 10.5px; color: var(--fg-muted); font-family: var(--mono); white-space: nowrap; }
.pva-delta { font-size: 11px; font-family: var(--mono); width: 58px; flex: 0 0 58px; text-align: right; color: var(--fg-subtle); }
.pva-delta.over { color: var(--attention-fg); }
.pva-delta.under { color: var(--accent-fg); }
.env-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border-muted); }
.env-cell { background: var(--canvas-default); padding: 13px 16px; }
.env-k { font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .03em; }
.env-v { font-size: 16px; font-weight: 600; margin-top: 3px; }
.env-s { font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); margin-top: 1px; }
.mini-log { padding: 6px 0; }
.ml-row { display: flex; align-items: center; gap: 11px; padding: 7px 16px; font-size: 12.5px; }
.ml-day { font-family: var(--mono); font-size: 11px; color: var(--fg-muted); width: 54px; flex: 0 0 54px; }
.ml-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-fg); flex: 0 0 6px; }
.ml-t { color: var(--fg-default); }

/* ============ JOURNAL ============ */
.j-tabs { display: inline-flex; border: 1px solid var(--border-default); border-radius: 7px; overflow: hidden; }
.j-tabs button { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--fg-muted); background: transparent; border: none; padding: 6px 16px; cursor: pointer; border-left: 1px solid var(--border-default); }
.j-tabs button:first-child { border-left: none; }
.j-tabs button:hover { color: var(--fg-default); background: var(--canvas-subtle); }
.j-tabs button.on { background: var(--canvas-subtle); color: var(--fg-default); }
.jgraph-box { margin-bottom: 18px; }
.jlegend { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--fg-muted); font-family: var(--mono); }
.jlegend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; border: 1px solid var(--border-muted); }
.jgraph-wrap { padding: 14px 16px; overflow-x: auto; }
.jgraph { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; min-width: max-content; }
.jcell { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(127,127,127,0.12); padding: 0; cursor: pointer; }
.jcell.sel { outline: 2px solid var(--accent-fg); outline-offset: 1px; }
.j-miles { display: flex; flex-wrap: wrap; gap: 8px; }
.j-mile { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-muted); border: 1px solid var(--border-default); border-radius: 20px; padding: 5px 12px; background: var(--canvas-default); }
.j-mile b { color: var(--fg-default); font-family: var(--mono); font-size: 11px; }
.j-mile.done { border-color: rgba(46,160,67,0.4); background: var(--success-muted); color: var(--fg-default); }
.j-mile.done svg { color: var(--success-fg); }
.j-mile svg { color: var(--fg-subtle); }
.j-mile .up { font-size: 10px; color: var(--fg-subtle); font-style: italic; }
.j-composer { border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); padding: 13px 14px; }
.jc-stamp { display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: var(--fg-muted); font-family: var(--mono); margin-bottom: 11px; flex-wrap: wrap; }
.jc-stamp svg { color: var(--fg-subtle); }
.jc-env { display: inline-flex; align-items: center; gap: 4px; }
.jc-auto { margin-left: auto; color: var(--fg-subtle); font-style: italic; }
.jc-types { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 11px; }
.jc-type { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--fg-muted); background: var(--canvas-subtle); border: 1px solid var(--border-muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-family: var(--sans); }
.jc-type:hover { color: var(--fg-default); }
.jc-type.on { background: var(--canvas-default); font-weight: 600; }
.jc-text { width: 100%; min-height: 70px; resize: vertical; background: var(--canvas-inset); border: 1px solid var(--border-default); border-radius: 7px; color: var(--fg-default); font-size: 13px; padding: 9px 11px; font-family: var(--sans); line-height: 1.5; margin-bottom: 10px; }
.jc-text:focus { outline: none; border-color: var(--accent-emphasis); box-shadow: 0 0 0 3px var(--accent-muted); }
.jc-foot { display: flex; align-items: center; }
.jc-foot .spacer { flex: 1; }
.j-entries { display: flex; flex-direction: column; gap: 10px; }
.j-entry { display: flex; border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); overflow: hidden; }
.j-entry.sel { border-color: var(--accent-fg); box-shadow: 0 0 0 1px var(--accent-fg); }
.je-rail { width: 128px; flex: 0 0 128px; background: var(--canvas-subtle); border-right: 1px solid var(--border-muted); padding: 12px 14px; }
.je-day { font-size: 14px; font-weight: 700; }
.je-wk { font-size: 11px; color: var(--fg-muted); font-family: var(--mono); margin-bottom: 9px; }
.je-env { display: flex; flex-direction: column; gap: 4px; }
.je-env span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--fg-muted); font-family: var(--mono); }
.je-env svg { color: var(--fg-subtle); }
.je-body { flex: 1; min-width: 0; padding: 12px 14px; }
.je-head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
.je-type { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; border-radius: 5px; padding: 2px 8px; }
.je-title { font-size: 13.5px; font-weight: 600; }
.je-text { font-size: 13px; color: var(--fg-muted); line-height: 1.55; }
.je-exp { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.ee-row { display: flex; gap: 9px; font-size: 12.5px; line-height: 1.5; }
.ee-k { flex: 0 0 76px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--fg-subtle); font-weight: 600; padding-top: 2px; }
.je-meas { display: flex; flex-wrap: wrap; gap: 7px; }
.meas-chip { font-size: 12px; font-family: var(--mono); color: var(--fg-default); background: var(--canvas-subtle); border: 1px solid var(--border-muted); border-radius: 6px; padding: 3px 9px; }
.meas-chip b { color: var(--fg-muted); font-weight: 600; }
.je-photo { display: flex; align-items: center; gap: 9px; height: 64px; border: 1px dashed var(--border-default); border-radius: 7px; color: var(--fg-subtle); font-size: 12px; font-family: var(--mono); justify-content: center; background: var(--canvas-subtle); }

/* ============ HISTORY / COMPARE ============ */
.ar-list { display: flex; flex-direction: column; border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden; }
.ar-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border-muted); }
.ar-row:first-child { border-top: none; }

.ar-row.sel { background: var(--accent-muted); }
.ar-check { display: grid; place-items: center; width: 18px; flex: 0 0 18px; }
.ar-check input { accent-color: var(--accent-fg); }
.ar-nocmp { color: var(--fg-subtle); }
.ar-badge { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; flex: 0 0 24px; }
.ar-badge.done { background: var(--success-muted); color: var(--success-fg); }
.ar-badge.abort { background: var(--danger-muted); color: var(--danger-fg); }
.ar-main { flex: 1; min-width: 0; }
.ar-name { font-size: 13.5px; font-weight: 600; }
.ar-strain { color: var(--fg-muted); font-weight: 400; }
.ar-meta { font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar-outcome { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
.ar-yield { font-size: 14px; font-weight: 600; }
.ar-yield small { font-size: 11px; color: var(--fg-muted); font-weight: 400; }
.ar-rating { font-size: 12.5px; color: #e3b341; font-weight: 600; }
.ar-reason { font-size: 12px; color: var(--danger-fg); font-family: var(--mono); }
.ar-open { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--accent-fg); background: none; border: none; cursor: pointer; font-family: var(--sans); flex: 0 0 auto; }
.ar-open:hover { text-decoration: underline; }
.cmp-panel { margin-top: 16px; }
.cmp-table { padding: 4px 0; }
.cmp-trow { display: grid; grid-template-columns: 140px 1fr 1fr; gap: 12px; padding: 8px 16px; font-size: 12.5px; border-top: 1px solid var(--border-muted); align-items: center; }
.cmp-trow:first-child { border-top: none; }
.cmp-trow.head { font-weight: 600; color: var(--fg-default); background: var(--canvas-subtle); }
.cmp-k { color: var(--fg-muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: .03em; font-weight: 600; }
.mini-stages { display: flex; height: 8px; width: 100%; max-width: 170px; border-radius: 3px; overflow: hidden; gap: 1px; }
.mini-stages span { display: block; height: 100%; }

/* ============ MAINTENANCE ============ */
.mt-prog { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-muted); font-family: var(--mono); }
.mt-prog-bar { width: 90px; height: 6px; border-radius: 4px; background: var(--canvas-subtle); border: 1px solid var(--border-muted); overflow: hidden; }
.mt-prog-fill { height: 100%; background: var(--success-fg); border-radius: 4px; transition: width .2s; }
.notif-pref { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg-muted); border: 1px solid var(--border-default); border-radius: 6px; padding: 4px 10px 4px 11px; background: var(--canvas-default); white-space: nowrap; }
.notif-pref svg { color: var(--fg-muted); }

/* needs attention */
.na-panel { border: 1px solid rgba(187,128,9,0.35); border-radius: 8px; background: var(--canvas-default); margin-bottom: 18px; overflow: hidden; }
.na-head { display: flex; align-items: center; gap: 9px; padding: 10px 14px; background: var(--attention-muted); border-bottom: 1px solid rgba(187,128,9,0.22); }
.na-head .na-ico { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: rgba(187,128,9,0.18); color: var(--attention-fg); flex: 0 0 24px; }
.na-head h3 { font-size: 13px; font-weight: 600; white-space: nowrap; }
.na-head .na-count { font-size: 11px; color: var(--fg-muted); font-family: var(--mono); border: 1px solid var(--border-muted); border-radius: 20px; padding: 0 7px; }
.na-head .na-note { margin-left: auto; font-size: 11px; color: var(--fg-muted); font-family: var(--mono); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.na-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border-muted); }
.na-row:first-child { border-top: none; }
.na-sev { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; flex: 0 0 30px; }
.na-sev.warn { background: var(--attention-muted); color: var(--attention-fg); }
.na-sev.err { background: var(--danger-muted); color: var(--danger-fg); }
.na-info { flex: 1; min-width: 0; }
.na-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.na-meta { font-size: 11.5px; color: var(--fg-muted); font-family: var(--mono); margin-top: 1px; }
.na-meta .na-dev { color: var(--accent-fg); }
.na-act { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

/* task list */
.mt-group { margin-bottom: 8px; }
.mt-group-h { display: flex; align-items: center; gap: 9px; padding: 8px 2px; }
.mt-group-h h4 { font-size: 12px; font-weight: 600; color: var(--fg-default); }
.mt-group-h .gh-sub { font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); }
.mt-group-h .rule { flex: 1; height: 1px; background: var(--border-muted); }
.task-list { border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden; background: var(--canvas-default); }
.task-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--border-muted); }
.task-row:first-child { border-top: none; }
.task-row:hover { background: var(--canvas-subtle); }
.task-row.done { background: color-mix(in srgb, var(--success-fg) 5%, var(--canvas-default)); }
.task-row.done:hover { background: color-mix(in srgb, var(--success-fg) 9%, var(--canvas-default)); }
.tcheck { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border-default); background: var(--canvas-inset); cursor: pointer; display: grid; place-items: center; flex: 0 0 20px; color: transparent; transition: all .12s; }
.tcheck:hover { border-color: var(--success-fg); }
.tcheck.on { background: var(--success-emphasis); border-color: var(--success-emphasis); color: #fff; }
.t-ico { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; flex: 0 0 28px; background: var(--canvas-subtle); border: 1px solid var(--border-muted); }
.t-info { flex: 1; min-width: 0; }
.t-name { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-row.done .t-name { color: var(--fg-muted); text-decoration: line-through; text-decoration-color: var(--fg-subtle); }
.t-sub { font-size: 11.5px; color: var(--fg-muted); font-family: var(--mono); margin-top: 1px; display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-sub > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-sub > span:first-child { flex: 0 0 auto; }
.t-sub .t-dev { color: var(--fg-subtle); }
.cadence-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; font-family: var(--sans); padding: 1px 7px; border-radius: 20px; cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
.cadence-tag:hover { border-color: var(--fg-subtle); }
.cad-daily { background: var(--accent-muted); color: var(--accent-fg); }
.cad-weekly { background: var(--done-muted); color: var(--done-fg); }
.cad-stage { background: var(--success-muted); color: var(--success-fg); }
.cad-runtime { background: var(--attention-muted); color: var(--attention-fg); }
.cad-custom { background: var(--canvas-subtle); color: var(--fg-muted); border: 1px solid var(--border-muted); }
.t-bell { width: 28px; height: 28px; border: 1px solid transparent; border-radius: 6px; background: transparent; cursor: pointer; display: grid; place-items: center; flex: 0 0 28px; color: var(--fg-subtle); }
.t-bell:hover { background: var(--canvas-subtle); color: var(--fg-default); border-color: var(--border-default); }
.t-bell.on { color: var(--accent-fg); }
.t-done-at { font-size: 11px; color: var(--success-fg); font-family: var(--mono); flex: 0 0 auto; display: flex; align-items: center; gap: 4px; }
.t-del { width: 28px; height: 28px; border: 1px solid transparent; border-radius: 6px; background: transparent; cursor: pointer; display: grid; place-items: center; flex: 0 0 28px; color: var(--fg-subtle); }
.t-del:hover { background: var(--danger-muted); color: var(--danger-fg); }

/* cadence editor popover (inline) */
.cad-pop { border-top: 1px solid var(--border-muted); background: var(--canvas-inset); padding: 11px 14px 12px 54px; display: flex; flex-direction: column; gap: 10px; }
.cad-opts { display: flex; flex-wrap: wrap; gap: 7px; }
.cad-opt { font-size: 12px; font-weight: 500; font-family: var(--sans); padding: 4px 11px; border-radius: 6px; border: 1px solid var(--border-default); background: var(--canvas-default); color: var(--fg-muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.cad-opt:hover { color: var(--fg-default); border-color: var(--fg-subtle); }
.cad-opt.on { background: var(--accent-muted); border-color: var(--accent-emphasis); color: var(--accent-fg); font-weight: 600; }
.cad-detail { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--fg-muted); }
.cad-detail input[type=range] { width: 150px; accent-color: var(--accent-fg); }
.cad-detail b { color: var(--fg-default); font-family: var(--mono); }
.cad-foot { display: flex; gap: 8px; align-items: center; }

/* add task inline */
.add-task { display: flex; align-items: center; gap: 11px; padding: 11px 14px; border-top: 1px dashed var(--border-default); }
.add-task input.atext { flex: 1; }
.add-task-trigger { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; padding: 10px; border: none; border-top: 1px solid var(--border-muted); background: transparent; color: var(--accent-fg); font-size: 12.5px; font-weight: 600; font-family: var(--sans); cursor: pointer; }
.add-task-trigger:hover { background: var(--canvas-subtle); }

/* week grid */
.wk-grid { border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden; background: var(--canvas-default); }
.wk-scroll { overflow-x: auto; }
.wk-table { width: 100%; border-collapse: collapse; min-width: 720px; }
.wk-table th, .wk-table td { border-bottom: 1px solid var(--border-muted); border-right: 1px solid var(--border-muted); }
.wk-table th:last-child, .wk-table td:last-child { border-right: none; }
.wk-table thead th { background: var(--canvas-subtle); padding: 9px 10px; text-align: center; font-size: 11px; font-weight: 600; color: var(--fg-muted); position: sticky; top: 0; }
.wk-table thead th.tcol { text-align: left; width: 250px; }
.wk-table th .wd { font-size: 13px; color: var(--fg-default); }
.wk-table th .wn { font-size: 10px; color: var(--fg-subtle); font-family: var(--mono); font-weight: 400; }
.wk-table th.today { background: var(--accent-muted); }
.wk-table th.today .wd { color: var(--accent-fg); }
.wk-tname { padding: 8px 12px; font-size: 12.5px; }
.wk-tname .wt-n { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.wk-tname .wt-s { font-size: 10.5px; color: var(--fg-subtle); font-family: var(--mono); margin-top: 1px; }
.wk-cell { text-align: center; height: 44px; vertical-align: middle; }
.wk-cell.today { background: color-mix(in srgb, var(--accent-fg) 5%, transparent); }
.wk-mark { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; }
.wk-mark.done { background: var(--success-muted); color: var(--success-fg); }
.wk-mark.missed { background: var(--danger-muted); color: var(--danger-fg); }
.wk-mark.due { background: var(--attention-muted); color: var(--attention-fg); border: 1px dashed rgba(187,128,9,0.5); }
.wk-na { color: var(--fg-subtle); font-size: 13px; }
.wk-legend { display: flex; gap: 16px; padding: 11px 14px; font-size: 11.5px; color: var(--fg-muted); }
.wk-legend span { display: inline-flex; align-items: center; gap: 6px; }
.wk-legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

/* history */
.hist-grid { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; }
@media (max-width: 900px) { .hist-grid { grid-template-columns: 1fr; } }
.hist-weeks { display: flex; flex-direction: column; }
.hw-week { border: 1px solid var(--border-default); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
.hw-wlabel { padding: 9px 13px; background: var(--canvas-subtle); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.hw-wlabel .hw-rate { margin-left: auto; font-size: 11px; font-family: var(--mono); color: var(--fg-muted); }
.hw-day { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-top: 1px solid var(--border-muted); cursor: pointer; width: 100%; background: transparent; border-left: none; border-right: none; border-bottom: none; font-family: var(--sans); text-align: left; }
.hw-day:hover { background: var(--canvas-subtle); }
.hw-day.sel { background: var(--accent-muted); }
.hw-ring { width: 26px; height: 26px; flex: 0 0 26px; }
.hw-dinfo { flex: 1; min-width: 0; }
.hw-dname { font-size: 12.5px; font-weight: 600; }
.hw-dsub { font-size: 10.5px; color: var(--fg-subtle); font-family: var(--mono); }
.hw-dcount { font-size: 11px; font-family: var(--mono); color: var(--fg-muted); }
.rec-card { border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); overflow: hidden; }
.rec-head { padding: 13px 16px; border-bottom: 1px solid var(--border-default); background: var(--canvas-subtle); display: flex; align-items: center; gap: 11px; }
.rec-head .rh-day { font-size: 15px; font-weight: 700; }
.rec-head .rh-date { font-size: 11.5px; color: var(--fg-muted); font-family: var(--mono); }
.rec-head .rh-badge { margin-left: auto; }
.rec-ro { margin-left: 8px; font-size: 10.5px; color: var(--fg-subtle); font-family: var(--mono); display: inline-flex; align-items: center; gap: 4px; }
.rec-sec { padding: 6px 0; }
.rec-sec-l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-subtle); font-weight: 600; padding: 9px 16px 4px; }
.rec-row { display: flex; align-items: center; gap: 11px; padding: 7px 16px; font-size: 12.5px; }
.rec-mk { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; flex: 0 0 18px; }
.rec-mk.done { background: var(--success-muted); color: var(--success-fg); }
.rec-mk.skip { background: var(--canvas-subtle); color: var(--fg-subtle); border: 1px solid var(--border-muted); }
.rec-row.skipped .rt { color: var(--fg-muted); }
.rec-row .rt { flex: 1; }
.rec-row .rt-time { font-size: 10.5px; color: var(--fg-subtle); font-family: var(--mono); }
.rec-note { margin: 6px 16px 12px; padding: 10px 12px; background: var(--canvas-inset); border: 1px solid var(--border-muted); border-radius: 7px; font-size: 12.5px; color: var(--fg-muted); line-height: 1.5; }
.rec-note b { color: var(--fg-default); font-weight: 600; }

/* ============ LOGGING ============ */
.log-layout { display: grid; grid-template-columns: 264px 1fr; gap: 18px; align-items: start; }
@media (max-width: 1080px) { .log-layout { grid-template-columns: 220px 1fr; } }

/* metric picker */
.metric-panel { border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); overflow: hidden; position: sticky; top: 0; }
.mp-head { display: flex; align-items: center; gap: 8px; padding: 11px 13px; border-bottom: 1px solid var(--border-default); background: var(--canvas-subtle); }
.mp-head h3 { font-size: 12.5px; font-weight: 600; }
.mp-head .mp-count { margin-left: auto; font-size: 11px; color: var(--fg-muted); font-family: var(--mono); }
.mp-group-l { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-subtle); font-weight: 600; padding: 10px 13px 4px; }
.metric-row { display: flex; align-items: center; gap: 10px; padding: 8px 13px; cursor: pointer; border-left: 2px solid transparent; }
.metric-row:hover { background: var(--canvas-subtle); }
.metric-row.on { background: var(--canvas-subtle); }
.mr-swatch { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 9px; border: 1px solid rgba(127,127,127,0.25); }
.metric-row.off .mr-swatch { background: transparent !important; }
.mr-info { flex: 1; min-width: 0; }
.mr-name { font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.metric-row.off .mr-name { color: var(--fg-muted); }
.mr-deriv { font-size: 9px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--done-fg); background: var(--done-muted); border-radius: 4px; padding: 0 4px; line-height: 14px; }
.mr-val { font-size: 11px; color: var(--fg-muted); font-family: var(--mono); margin-top: 1px; }
.mr-spark { width: 46px; height: 18px; flex: 0 0 46px; }
.mr-eye { color: var(--fg-subtle); flex: 0 0 auto; display: grid; place-items: center; }
.metric-row.on .mr-eye { color: var(--accent-fg); }
.mp-foot { padding: 9px 13px; border-top: 1px solid var(--border-muted); }

/* chart workspace */
.chart-wrap { min-width: 0; }
.chart-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.ct-spacer { flex: 1; }
.layout-tabs { display: inline-flex; align-items: center; gap: 6px; }
.layout-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; font-family: var(--sans); color: var(--fg-muted); background: var(--canvas-default); border: 1px solid var(--border-default); border-radius: 20px; padding: 4px 12px; cursor: pointer; white-space: nowrap; }
.layout-chip:hover { border-color: var(--fg-subtle); color: var(--fg-default); }
.layout-chip.on { background: var(--accent-muted); border-color: var(--accent-emphasis); color: var(--accent-fg); font-weight: 600; }
.layout-chip .lc-x { opacity: .5; display: grid; place-items: center; }
.layout-chip .lc-x:hover { opacity: 1; }
.layout-add { width: 28px; height: 28px; border-radius: 50%; border: 1px dashed var(--border-default); background: transparent; color: var(--fg-muted); cursor: pointer; display: grid; place-items: center; }
.layout-add:hover { border-color: var(--accent-fg); color: var(--accent-fg); }

.seg-mode { display: inline-flex; border: 1px solid var(--border-default); border-radius: 6px; overflow: hidden; }
.seg-mode button { display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--fg-muted); background: transparent; border: none; padding: 5px 11px; cursor: pointer; border-left: 1px solid var(--border-default); }
.seg-mode button:first-child { border-left: none; }
.seg-mode button:hover { color: var(--fg-default); background: var(--canvas-subtle); }
.seg-mode button.on { background: var(--canvas-subtle); color: var(--fg-default); font-weight: 600; }

/* summary stat cards */
.stat-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat-card { border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); padding: 11px 13px; }
.sc-top { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
.sc-sw { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 8px; }
.sc-name { font-size: 12px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc-deriv { font-size: 8.5px; font-weight: 700; text-transform: uppercase; color: var(--done-fg); background: var(--done-muted); border-radius: 3px; padding: 0 4px; line-height: 13px; }
.sc-stats { display: flex; gap: 12px; }
.sc-stat { display: flex; flex-direction: column; }
.sc-k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-subtle); font-weight: 600; }
.sc-v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sc-v.avg { color: var(--fg-default); }
.sc-v small { font-size: 10px; color: var(--fg-muted); font-weight: 400; }

/* the chart */
.chart-box { border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); overflow: hidden; }
.chart-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border-default); background: var(--canvas-subtle); flex-wrap: wrap; }
.chart-head .ch-legend { display: flex; gap: 12px; flex-wrap: wrap; }
.cl-item { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--fg-muted); }
.cl-item b { color: var(--fg-default); font-weight: 500; }
.cl-line { width: 14px; height: 3px; border-radius: 2px; }
.chart-opts { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.copt { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-family: var(--sans); color: var(--fg-muted); background: transparent; border: 1px solid var(--border-default); border-radius: 20px; padding: 3px 9px; cursor: pointer; white-space: nowrap; }
.copt:hover { color: var(--fg-default); border-color: var(--fg-subtle); }
.copt.on { background: var(--accent-muted); border-color: transparent; color: var(--accent-fg); }
.copt .swatch-sq { width: 9px; height: 9px; border-radius: 2px; }
.chart-canvas { padding: 8px 6px 4px; }
.chart-svg { width: 100%; display: block; overflow: visible; }
.axis-label { font-size: 9.5px; fill: var(--fg-subtle); font-family: var(--mono); }
.axis-line { stroke: var(--border-muted); stroke-width: 1; }
.axis-zero { stroke: var(--border-default); stroke-width: 1; }
.grid-line { stroke: var(--border-muted); stroke-width: 1; stroke-dasharray: 2 3; opacity: .5; }
.night-band { fill: var(--fg-default); opacity: 0.04; }
.night-hatch { fill: url(#nightHatch); }
.target-band-l { stroke-dasharray: 3 3; stroke-width: 1; }
.event-line { stroke-width: 1; stroke-dasharray: 3 2; opacity: .55; }
.event-flag { cursor: pointer; }
.event-flag .ef-box { rx: 3; }
.oor-band { opacity: 0.12; }
.chart-xaxis { display: flex; justify-content: space-between; padding: 4px 12px 10px 46px; }
.xt { font-size: 10px; color: var(--fg-subtle); font-family: var(--mono); }
.chart-foot { display: flex; align-items: center; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--border-muted); flex-wrap: wrap; }
.cf-item { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-muted); }
.cf-item .cf-sw { width: 16px; height: 11px; border-radius: 3px; display: inline-block; }
.cf-hatch { background: repeating-linear-gradient(45deg, transparent, transparent 2px, var(--fg-subtle) 2px, var(--fg-subtle) 3px); opacity: .5; }

/* event annotations row toggle */
.evt-pop { position: absolute; z-index: 20; background: var(--canvas-overlay); border: 1px solid var(--border-default); border-radius: 7px; box-shadow: 0 8px 24px rgba(1,4,9,0.4); padding: 9px 11px; font-size: 11.5px; width: 200px; }
.evt-pop .ep-t { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.evt-pop .ep-m { color: var(--fg-muted); font-family: var(--mono); font-size: 10.5px; margin-top: 3px; }
.evt-pop .ep-src { margin-top: 5px; font-size: 10px; }

/* save layout inline */
.save-layout-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 11px 13px; border: 1px dashed var(--border-default); border-radius: 8px; background: var(--canvas-inset); }
.save-layout-row .atext { flex: 1; }

/* ============ SETUP VIEW — LAYOUT MODE ============ */
.sv-modes { display: inline-flex; border: 1px solid var(--border-default); border-radius: 6px; overflow: hidden; }
.sv-modes button { display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: 12.5px; font-weight: 600; color: var(--fg-muted); background: transparent; border: none; padding: 5px 13px; cursor: pointer; border-left: 1px solid var(--border-default); }
.sv-modes button:first-child { border-left: none; }
.sv-modes button:hover { color: var(--fg-default); background: var(--canvas-subtle); }
.sv-modes button.on { background: var(--canvas-subtle); color: var(--fg-default); }

/* dimension bar */
.dim-bar { display: flex; align-items: center; gap: 16px; border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); padding: 12px 16px; margin-bottom: 16px; flex-wrap: wrap; }
.dim-title { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
.dim-title svg { color: var(--fg-muted); }
.dim-fields { display: flex; align-items: center; gap: 10px; }
.dim-field { display: flex; align-items: center; gap: 7px; }
.dim-field label { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--fg-muted); font-weight: 600; }
.dim-input { display: inline-flex; align-items: center; border: 1px solid var(--border-default); border-radius: 6px; background: var(--canvas-inset); overflow: hidden; }
.dim-input input { width: 52px; background: transparent; border: none; color: var(--fg-default); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 5px 8px; text-align: right; font-family: var(--mono); }
.dim-input input:focus { outline: none; }
.dim-input .du { padding: 0 8px; font-size: 11px; color: var(--fg-muted); border-left: 1px solid var(--border-default); align-self: stretch; display: flex; align-items: center; background: var(--canvas-subtle); }
.dim-x { color: var(--fg-subtle); font-size: 13px; }
.dim-meta { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 11.5px; color: var(--fg-muted); font-family: var(--mono); }
.dim-meta b { color: var(--fg-default); }
.dim-unit-toggle { display: inline-flex; border: 1px solid var(--border-default); border-radius: 5px; overflow: hidden; }
.dim-unit-toggle button { font-family: var(--mono); font-size: 11px; color: var(--fg-muted); background: transparent; border: none; padding: 3px 8px; cursor: pointer; border-left: 1px solid var(--border-default); }
.dim-unit-toggle button:first-child { border-left: none; }
.dim-unit-toggle button.on { background: var(--canvas-subtle); color: var(--fg-default); }

/* layout split */
.sv-layout { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .sv-layout { grid-template-columns: 1fr 260px; } }

/* plan canvas */
.plan-box { border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); overflow: hidden; }
.plan-head { display: flex; align-items: center; gap: 9px; padding: 9px 13px; border-bottom: 1px solid var(--border-default); background: var(--canvas-subtle); }
.plan-head h3 { font-size: 12.5px; font-weight: 600; }
.plan-head .ph-hint { margin-left: auto; font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); display: flex; align-items: center; gap: 5px; }
.plan-canvas { position: relative; padding: 22px; background:
   repeating-linear-gradient(0deg, transparent, transparent 23px, var(--border-muted) 23px, var(--border-muted) 24px),
   repeating-linear-gradient(90deg, transparent, transparent 23px, var(--border-muted) 24px); }
.plan-stage { position: relative; }
.plan-svg { width: 100%; display: block; overflow: visible; touch-action: none; }
.plan-grid-line { stroke: var(--border-muted); stroke-width: 1; }
.plan-grid-major { stroke: var(--border-default); stroke-width: 1; }
.plan-wall { fill: var(--canvas-inset); stroke: var(--fg-subtle); stroke-width: 2; }
.plan-dim-label { fill: var(--fg-muted); font-size: 11px; font-family: var(--mono); }
.plan-door { stroke: var(--accent-fg); stroke-width: 2; fill: none; opacity: .7; }
.plan-axis { fill: var(--fg-subtle); font-size: 10px; font-family: var(--mono); }

/* device marker on plan */
.pin { cursor: grab; }
.pin:active { cursor: grabbing; }
.pin-dot { stroke: var(--canvas-default); stroke-width: 2; }
.pin.sel .pin-dot { stroke: var(--accent-fg); stroke-width: 2.5; }
.pin-ring { fill: none; stroke: var(--accent-fg); stroke-width: 1.5; opacity: .5; }
.pin-label { fill: var(--fg-default); font-size: 10.5px; font-weight: 600; font-family: var(--sans); }
.pin-label-bg { fill: var(--canvas-default); opacity: .82; rx: 3; }
.pin-z { fill: var(--fg-muted); font-size: 9px; font-family: var(--mono); }

.plan-foot { display: flex; align-items: center; gap: 16px; padding: 9px 13px; border-top: 1px solid var(--border-muted); flex-wrap: wrap; }
.plan-legend { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-muted); }
.plan-legend .pl-dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--canvas-default); }
.plan-foot .pf-scale { margin-left: auto; font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); display: flex; align-items: center; gap: 7px; }

/* side panels */
.sv-side { display: flex; flex-direction: column; gap: 14px; }
.sv-panel { border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); overflow: hidden; }
.svp-head { display: flex; align-items: center; gap: 8px; padding: 10px 13px; border-bottom: 1px solid var(--border-default); background: var(--canvas-subtle); }
.svp-head h3 { font-size: 12.5px; font-weight: 600; }
.svp-head .svp-count { margin-left: auto; font-size: 11px; color: var(--fg-muted); font-family: var(--mono); border: 1px solid var(--border-muted); border-radius: 20px; padding: 0 7px; }

/* placed device row */
.placed-row { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-top: 1px solid var(--border-muted); cursor: pointer; border-left: 2px solid transparent; }
.placed-row:first-child { border-top: none; }
.placed-row:hover { background: var(--canvas-subtle); }
.placed-row.sel { background: var(--accent-muted); border-left-color: var(--accent-fg); }
.pr-dot { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: 0 0 20px; color: #fff; }
.pr-info { flex: 1; min-width: 0; }
.pr-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-meta { font-size: 10.5px; color: var(--fg-muted); font-family: var(--mono); }
.pr-z { font-size: 11px; color: var(--fg-muted); font-family: var(--mono); display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }

/* inline editor */
.pin-editor { border-top: 1px solid var(--border-default); background: var(--canvas-inset); padding: 12px 13px; }
.pe-head { display: flex; align-items: center; gap: 8px; margin-bottom: 11px; }
.pe-dot { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; flex: 0 0 22px; }
.pe-name { font-size: 12.5px; font-weight: 600; flex: 1; min-width: 0; }
.pe-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; margin-bottom: 11px; }
.pe-field { display: flex; flex-direction: column; gap: 5px; }
.pe-field label { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; color: var(--fg-muted); font-weight: 600; }
.pe-num { display: inline-flex; align-items: center; border: 1px solid var(--border-default); border-radius: 6px; background: var(--canvas-default); overflow: hidden; }
.pe-num input { width: 100%; min-width: 0; background: transparent; border: none; color: var(--fg-default); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 5px 7px; text-align: right; font-family: var(--mono); }
.pe-num input:focus { outline: none; }
.pe-num .pu { padding: 0 6px; font-size: 10px; color: var(--fg-muted); border-left: 1px solid var(--border-default); align-self: stretch; display: flex; align-items: center; }
.pe-role { margin-bottom: 11px; }
.pe-role label { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; color: var(--fg-muted); font-weight: 600; display: block; margin-bottom: 5px; }
.pe-foot { display: flex; align-items: center; gap: 8px; }
.pe-foot .spacer { flex: 1; }

/* available device row */
.avail-row { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-top: 1px solid var(--border-muted); cursor: grab; }
.avail-row:first-child { border-top: none; }
.avail-row:hover { background: var(--canvas-subtle); }
.avail-row:active { cursor: grabbing; }
.avail-row.dragging { opacity: .4; }
.ar-grip { color: var(--fg-subtle); display: grid; place-items: center; flex: 0 0 auto; }
.ar-kind { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: 0 0 20px; color: #fff; }
.ar-i { flex: 1; min-width: 0; }
.ar-n { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar-m { font-size: 10.5px; color: var(--fg-muted); font-family: var(--mono); }
.ar-add { width: 26px; height: 26px; border: 1px solid var(--border-default); border-radius: 6px; background: var(--canvas-default); color: var(--fg-muted); cursor: pointer; display: grid; place-items: center; flex: 0 0 26px; }
.ar-add:hover { border-color: var(--accent-fg); color: var(--accent-fg); }
.avail-empty { padding: 16px 13px; text-align: center; font-size: 11.5px; color: var(--fg-subtle); }
.drop-hint { position: absolute; inset: 14px; border: 2px dashed var(--accent-fg); border-radius: 8px; background: var(--accent-muted); display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 5; }
.plan-canvas.drop-active .drop-hint { opacity: 1; }

function Sparkline({ data, color, height = 30 }) {
  const w = 200, h = height, pad = 2;
  const min = Math.min(...data), max = Math.max(...data);
  const rng = max - min || 1;
  const pts = data.map((v, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = pad + (1 - (v - min) / rng) * (h - pad * 2);
    return [x, y];
  });
  const line = pts.map((p) => p.join(",")).join(" ");
  const area = `${pad},${h} ${line} ${w - pad},${h}`;
  const gid = "g" + Math.abs(data[0] * 1000 | 0) + color.slice(1);
  return (
    <svg className="s-spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: "100%" }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.22" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <polygon points={area} fill={`url(#${gid})`} />
      <polyline points={line} fill="none" stroke={color} strokeWidth="1.5"
        strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
      <circle cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="2" fill={color} />
    </svg>
  );
}

function SettingsPage({ seed }) {
  const [devices, setDevices] = useState(seed.devices);
  const [scan, setScan] = useState(seed.scan);
  const [found, setFound] = useState(seed.devices.length);
  const [prov, setProv] = useState(false);
  const timers = React.useRef([]);
  const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };

  const startScan = () => {
    clearTimers();
    setScan("scanning"); setDevices([]); setFound(0);
    CONFIGURED_DEVICES.forEach((d, i) => {
      timers.current.push(setTimeout(() => { setDevices((prev) => [...prev, d]); setFound((c) => c + 1); }, 450 + i * 420));
    });
    timers.current.push(setTimeout(() => setScan("done"), 450 + CONFIGURED_DEVICES.length * 420 + 500));
  };
  React.useEffect(() => () => clearTimers(), []);

  const forgetAll = () => { clearTimers(); setDevices([]); setScan("idle"); setFound(0); };
  const setRole = (id, role) => setDevices((prev) => prev.map((d) => (d.id === id ? { ...d, role } : d)));

  const online = devices.filter((d) => d.online).length;
  const totalMetrics = devices.reduce((n, d) => n + (d.online ? d.metrics.length : 0), 0);
  const totalControls = devices.reduce((n, d) => n + (d.online ? d.controls.length : 0), 0);
  const assigned = devices.filter((d) => d.role).length;
  const unassigned = devices.filter((d) => !d.role && d.online).length;
  const showEmpty = scan !== "scanning" && devices.length === 0;

  return (
    <>
      <div className="content-header">
        <div className="ch-titles">
          <div className="ch-crumb">Tent 1 <span className="sep">/</span> Configuration <span className="sep">/</span> Settings</div>
          <div className="ch-title">Settings
            {devices.length > 0 && <span className="tag b-ok"><span className="dot-live" style={{ width: 7, height: 7 }} />{online} online</span>}
          </div>
        </div>
        <div className="ch-actions">
          {scan === "done" && <button className="btn btn-icon" title="Re-scan" onClick={startScan}><IcoRefresh s={15} /></button>}
          <button className="btn"><IcoExternal s={14} /> Docs</button>
        </div>
      </div>

      <div className="scroll">
        <div className="canvas-pad">
          <ConnectionArea scan={scan} found={found} onScan={startScan} onProvision={() => setProv(true)} hasDevices={devices.length > 0} onForget={forgetAll} />

          {showEmpty && <SettingsEmpty onScan={startScan} onProvision={() => setProv(true)} />}

          {!showEmpty && (
            <>
              <div className="callout">
                <span className="callout-ico"><IcoBolt s={16} /></span>
                <div className="callout-body">
                  <div className="callout-title">Capabilities unlock automation</div>
                  <div className="callout-text">Detected metrics and controls determine which automations are available. Pair a <b>sensor role</b> with an <b>equipment role</b> to enable an automation in <span className="mono-ref">Automation</span>.</div>
                </div>
                <div className="callout-stats">
                  <span><b>{totalMetrics}</b> metrics</span><span className="sep">·</span>
                  <span><b>{totalControls}</b> controls</span><span className="sep">·</span>
                  <span><b>{assigned}</b> roles set</span>
                </div>
              </div>

              <div className="sec-head">
                <h2>Discovered devices</h2>
                <span className="count">{devices.length} found{scan === "scanning" ? " · scanning" : ""}</span>
                <span className="rule" />
                <span className="link">Add manually</span>
              </div>
              <div className="dev-list">
                {devices.map((d) => <DeviceCard key={d.id} d={d} />)}
              </div>

              {scan === "done" && (
                <>
                  <div className="sec-head" style={{ marginTop: 28 }}>
                    <h2>Device roles</h2>
                    <span className="count">{assigned}/{devices.length} assigned</span>
                    <span className="rule" />
                    {unassigned > 0 && <span className="tag b-warn" style={{ fontSize: 11 }}><IcoAlert s={11} />{unassigned} need a role</span>}
                  </div>
                  <div className="roles-box">
                    <div className="roles-head"><span>Device</span><span>Detected as</span><span>Grow role</span><span>Unlocks</span></div>
                    {devices.map((d) => <RoleRow key={d.id} d={d} onRole={setRole} />)}
                  </div>
                </>
              )}
            </>
          )}
        </div>
      </div>

      {prov && <ProvisionModal onClose={() => setProv(false)} />}
    </>
  );
}

function AutomationPage({ empty, onGoSettings }) {
  const [mode, setMode] = useState("veg");
  const [list, setList] = useState(() => AUTOS_SEED.map(cloneAuto));
  const [fails, setFails] = useState(() => FAILSAFES_SEED.map(cloneAuto));
  const [openSec, setOpenSec] = useState({ lighting: true, climate: true, airflow: false, co2: false, irrigation: false });
  const [openRow, setOpenRow] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const nid = React.useRef(1);

  if (empty) return <AutomationEmpty onGoSettings={onGoSettings} />;

  const inList = (id) => list.some((a) => a.id === id);
  const patch = (id, fn) => (inList(id) ? setList : setFails)((prev) => prev.map((a) => (a.id === id ? fn(a) : a)));
  const h = {
    goSettings: onGoSettings,
    toggle: (id) => patch(id, (a) => ({ ...a, enabled: !a.enabled, override: undefined })),
    openConfig: (id) => { setOpenRow((o) => (o === id ? null : id)); setConfirm(null); },
    closeConfig: () => { setOpenRow(null); setConfirm(null); },
    override: (id) => patch(id, (a) => ({ ...a, override: "held off" })),
    resume: (id) => patch(id, (a) => ({ ...a, override: undefined })),
    field: (id, k, val, isField) => patch(id, (a) => (isField
      ? { ...a, fields: a.fields.map((f) => (f.k === k ? { ...f, val } : f)) }
      : { ...a, [k]: val })),
    askDelete: (id) => setConfirm(id),
    cancelDelete: () => setConfirm(null),
    confirmDelete: (id) => { setConfirm(null); setOpenRow(null); (inList(id) ? setList : setFails)((p) => p.filter((a) => a.id !== id)); },
    add: (sub) => { const id = "new" + nid.current++; setList((p) => [...p, newAuto(sub, id)]); setOpenSec((s) => ({ ...s, [sub]: true })); setOpenRow(id); setConfirm(null); },
  };
  const running = list.filter((a) => a.enabled && !a.locked).length + fails.filter((a) => a.enabled && !a.locked).length;

  return (
    <>
      <div className="content-header">
        <div className="ch-titles">
          <div className="ch-crumb">Tent 1 <span className="sep">/</span> Veg · Day 24 <span className="sep">/</span> Automation</div>
          <div className="ch-title">Automation <span className="tag b-ok"><span className="dot-live" style={{ width: 7, height: 7 }} /> {running} running</span></div>
        </div>
        <div className="ch-actions"><button className="btn" onClick={onGoSettings}><IcoRefresh s={14} /> Synced from Settings</button></div>
      </div>
      <div className="scroll">
        <div className="canvas-pad">
          <GrowthHero mode={mode} onMode={setMode} />
          {SUBSYS.map((s) => (
            <AutoSection key={s.id} s={s} autos={list.filter((a) => a.sub === s.id)}
              open={!!openSec[s.id]} onToggle={() => setOpenSec((o) => ({ ...o, [s.id]: !o[s.id] }))}
              openRow={openRow} confirm={confirm} h={h} />
          ))}
          <div className="fs-group">
            <div className="fs-head">
              <span className="fs-ico"><IcoAlert s={15} /></span>
              <h3>Failsafes</h3>
              <span className="fs-note">always active · independent of growth mode</span>
            </div>
            <div className="fs-body">
              {fails.map((a) => <AutoRow key={a.id} a={a} open={openRow === a.id} confirming={confirm === a.id} h={h} />)}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

function gcFmt(d) { return d.toLocaleDateString("en-US", { month:"short", day:"numeric" }); }
