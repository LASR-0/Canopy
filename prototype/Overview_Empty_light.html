<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Overview · Empty · light</title>
<style>
:root {
  /* Primer light — canvas */
  --canvas-default: #ffffff;
  --canvas-inset: #f6f8fa;
  --canvas-subtle: #f6f8fa;
  --canvas-overlay: #ffffff;
  --canvas-hover: #eef1f4;
  /* borders */
  --border-default: #d1d9e0;
  --border-muted: #e4e8ec;
  /* foreground */
  --fg-default: #1f2328;
  --fg-muted: #59636e;
  --fg-subtle: #818b98;
  /* roles */
  --accent-fg: #0969da;
  --accent-emphasis: #0969da;
  --accent-muted: rgba(9,105,218,0.12);
  --success-fg: #1a7f37;
  --success-emphasis: #1f883d;
  --success-muted: rgba(31,136,61,0.12);
  --attention-fg: #9a6700;
  --attention-muted: rgba(154,103,0,0.12);
  --danger-fg: #cf222e;
  --danger-muted: rgba(207,34,46,0.10);
  --done-fg: #8250df;
  --done-muted: rgba(130,80,223,0.10);
  /* btn */
  --btn-bg: #f6f8fa;
  --btn-hover: #eef1f4;
  --btn-border: rgba(31,35,40,0.15);
  --shadow-sm: 0 1px 0 rgba(31,35,40,0.04);

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--fg-default);
  background: var(--canvas-inset);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#root { height: 100vh; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #d1d9e0; border-radius: 6px; border: 2px solid var(--canvas-default); }
::-webkit-scrollbar-thumb:hover { background: #b1bac4; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ APP FRAME ============ */
.app { display: flex; flex-direction: column; height: 100vh; background: var(--canvas-default); }

/* titlebar */
.titlebar {
  height: 44px; flex: 0 0 44px;
  display: flex; align-items: center; gap: 12px;
  padding: 0 12px;
  background: var(--canvas-subtle);
  border-bottom: 1px solid var(--border-default);
  -webkit-app-region: drag;
  user-select: none;
}
.traffic { display: flex; gap: 8px; padding-right: 4px; }
.traffic span { width: 12px; height: 12px; border-radius: 50%; display: block; }
.traffic .r { background: #ff5f57; }
.traffic .y { background: #febc2e; }
.traffic .g { background: #28c840; }
.tb-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; letter-spacing: -0.1px; }
.tb-brand .mark {
  width: 20px; height: 20px; border-radius: 5px;
  background: linear-gradient(160deg, #2ea043, #238636);
  display: grid; place-items: center; color: #fff;
}
.tb-brand .mark svg { width: 13px; height: 13px; }
.tb-spacer { flex: 1; }
.cmdk {
  -webkit-app-region: no-drag;
  display: flex; align-items: center; gap: 8px;
  height: 28px; width: 320px; max-width: 34vw;
  padding: 0 8px 0 10px;
  background: var(--canvas-inset);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  color: var(--fg-subtle); font-size: 13px;
  cursor: text;
}
.cmdk:hover { border-color: var(--fg-subtle); }
.cmdk .kbd {
  margin-left: auto;
  font-family: var(--mono); font-size: 11px;
  color: var(--fg-muted);
  border: 1px solid var(--border-default); border-radius: 4px;
  padding: 1px 5px; background: var(--canvas-subtle);
}
.tb-icon-btn {
  -webkit-app-region: no-drag;
  width: 30px; height: 28px; display: grid; place-items: center;
  border: 1px solid transparent; border-radius: 6px;
  color: var(--fg-muted); background: transparent; cursor: pointer;
}
.tb-icon-btn:hover { background: var(--canvas-inset); color: var(--fg-default); }
.tb-avatar {
  -webkit-app-region: no-drag;
  width: 24px; height: 24px; border-radius: 50%;
  background: linear-gradient(150deg,#6e40c9,#3081f7);
  display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 600;
  cursor: pointer;
}

/* body split */
.body { display: flex; flex: 1; min-height: 0; }

/* ============ SIDEBAR ============ */
.sidebar {
  width: 248px; flex: 0 0 248px;
  background: var(--canvas-inset);
  border-right: 1px solid var(--border-default);
  display: flex; flex-direction: column;
  min-height: 0;
}
.workspace {
  margin: 12px 12px 4px;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--border-default);
  border-radius: 6px; cursor: pointer;
  background: var(--canvas-default);
}
.workspace:hover { border-color: var(--fg-subtle); }
.workspace .ws-ico {
  width: 28px; height: 28px; border-radius: 6px; flex: 0 0 28px;
  background: var(--success-muted); color: var(--success-fg);
  display: grid; place-items: center;
}
.workspace .ws-meta { min-width: 0; flex: 1; }
.workspace .ws-name { font-weight: 600; font-size: 13px; line-height: 1.3; }
.workspace .ws-sub { font-size: 11px; color: var(--fg-muted); display: flex; align-items: center; gap: 5px; }
.workspace .chev { color: var(--fg-muted); }

.nav { padding: 8px; overflow-y: auto; flex: 1; }
.nav-group-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--fg-subtle);
  padding: 12px 10px 4px;
}
.nav-item {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  padding: 7px 10px; margin: 1px 0;
  border-radius: 6px; border: 1px solid transparent;
  background: transparent; cursor: pointer;
  color: var(--fg-muted); font-size: 14px; font-weight: 500;
  font-family: var(--sans);
}
.nav-item:hover { background: var(--canvas-subtle); color: var(--fg-default); }
.nav-item .ni-ico { width: 16px; height: 16px; flex: 0 0 16px; display: grid; place-items: center; color: var(--fg-muted); }
.nav-item:hover .ni-ico { color: var(--fg-default); }
.nav-item .ni-count {
  margin-left: auto; font-size: 11px; font-family: var(--mono);
  color: var(--fg-muted); background: var(--canvas-subtle);
  border: 1px solid var(--border-muted); border-radius: 20px; padding: 0 7px; line-height: 18px;
}
.nav-item.active { background: var(--canvas-subtle); color: var(--fg-default); font-weight: 600; }
.nav-item.active .ni-ico { color: var(--fg-default); }
.nav-item.active::before {
  content: ""; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 22px; border-radius: 0 4px 4px 0; background: #f78166;
}

.sb-footer {
  border-top: 1px solid var(--border-default);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--fg-muted);
}
.dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--success-fg); box-shadow: 0 0 0 3px var(--success-muted); flex: 0 0 8px; }
.sb-footer .gear { margin-left: auto; color: var(--fg-muted); cursor: pointer; display: grid; place-items: center; }
.sb-footer .gear:hover { color: var(--fg-default); }
@keyframes pulse { 0%,100%{ opacity: 1; } 50% { opacity: 0.4; } }
.dot-live { animation: pulse 2.4s ease-in-out infinite; }

/* ============ MAIN ============ */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--canvas-default); }
.content-header {
  flex: 0 0 auto;
  padding: 20px 28px 16px;
  border-bottom: 1px solid var(--border-default);
  display: flex; align-items: flex-end; gap: 16px;
}
.ch-titles { flex: 1; min-width: 0; }
.ch-crumb { font-size: 12px; color: var(--fg-muted); display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.ch-crumb .sep { color: var(--fg-subtle); }
.ch-title { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; }
.ch-actions { display: flex; align-items: center; gap: 8px; }

/* segmented */
.segmented { display: inline-flex; border: 1px solid var(--border-default); border-radius: 6px; overflow: hidden; background: var(--canvas-default); }
.segmented button {
  font-family: var(--mono); font-size: 12px; color: var(--fg-muted);
  background: transparent; border: none; padding: 5px 11px; cursor: pointer;
  border-left: 1px solid var(--border-default);
}
.segmented button:first-child { border-left: none; }
.segmented button:hover { color: var(--fg-default); background: var(--canvas-subtle); }
.segmented button.on { color: var(--fg-default); background: var(--canvas-subtle); font-weight: 600; }

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--sans); font-size: 13px; font-weight: 600;
  color: var(--fg-default); background: var(--btn-bg);
  border: 1px solid var(--btn-border); border-radius: 6px;
  padding: 5px 12px; cursor: pointer; line-height: 20px;
}
.btn:hover { background: var(--btn-hover); border-color: var(--fg-subtle); }
.btn svg { color: var(--fg-muted); }
.btn.primary { background: var(--success-emphasis); border-color: rgba(240,246,252,0.1); color: #fff; }
.btn.primary:hover { background: #2ea043; }
.btn.primary svg { color: #fff; }
.btn-icon { padding: 6px; }

.scroll { overflow-y: auto; flex: 1; }
.canvas-pad { padding: 24px 28px 48px; max-width: 1320px; }

/* section heading inside content */
.sec-head { display: flex; align-items: center; gap: 10px; margin: 26px 0 12px; }
.sec-head:first-child { margin-top: 0; }
.sec-head h2 { font-size: 14px; font-weight: 600; color: var(--fg-default); }
.sec-head .count { font-size: 12px; color: var(--fg-muted); font-family: var(--mono); }
.sec-head .rule { flex: 1; height: 1px; background: var(--border-muted); }
.sec-head .link { font-size: 12px; color: var(--accent-fg); cursor: pointer; }
.sec-head .link:hover { text-decoration: underline; }

/* ============ SENSOR CARDS ============ */
.sensor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
.s-card {
  border: 1px solid var(--border-default); border-radius: 8px;
  background: var(--canvas-default); padding: 14px 14px 12px;
  display: flex; flex-direction: column; gap: 10px;
  transition: border-color .12s ease;
}
.s-card:hover { border-color: var(--fg-subtle); }
.s-top { display: flex; align-items: center; gap: 8px; }
.s-ico { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; flex: 0 0 26px; }
.s-label { font-size: 12px; color: var(--fg-muted); font-weight: 500; flex: 1; }
.s-status { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
.s-valrow { display: flex; align-items: baseline; gap: 5px; }
.s-val { font-size: 28px; font-weight: 600; letter-spacing: -0.6px; font-feature-settings: "tnum"; line-height: 1; }
.s-unit { font-size: 13px; color: var(--fg-muted); font-weight: 500; }
.s-delta { margin-left: auto; font-size: 12px; font-family: var(--mono); display: flex; align-items: center; gap: 3px; }
.s-delta.up { color: var(--success-fg); }
.s-delta.down { color: var(--danger-fg); }
.s-delta.flat { color: var(--fg-muted); }
.s-spark { height: 30px; }
.s-foot { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); }
.s-target { display: flex; align-items: center; gap: 5px; }
.s-badge { font-size: 10px; font-weight: 600; letter-spacing: 0.02em; padding: 1px 6px; border-radius: 20px; text-transform: uppercase; font-family: var(--sans); }

/* ============ TWO-COL ============ */
.two-col { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 1080px) { .two-col { grid-template-columns: 1fr; } }

.box { border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); overflow: hidden; }
.box-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border-default); background: var(--canvas-subtle); }
.box-head h3 { font-size: 13px; font-weight: 600; }
.box-head .count { font-size: 11px; color: var(--fg-muted); font-family: var(--mono); border: 1px solid var(--border-muted); border-radius: 20px; padding: 0 7px; }
.box-head .h-link { margin-left: auto; font-size: 12px; color: var(--accent-fg); cursor: pointer; }
.box-head .h-link:hover { text-decoration: underline; }

/* activity feed */
.feed { padding: 4px 0; }
.feed-row { display: flex; gap: 12px; padding: 9px 16px; position: relative; }
.feed-row:hover { background: var(--canvas-subtle); }
.feed-ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 26px; border: 1px solid var(--border-default); background: var(--canvas-default); }
.feed-body { flex: 1; min-width: 0; }
.feed-text { font-size: 13px; color: var(--fg-default); }
.feed-text b { font-weight: 600; }
.feed-text .src { color: var(--accent-fg); }
.feed-meta { font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); margin-top: 1px; display: flex; gap: 8px; }
.feed-time { font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); white-space: nowrap; flex: 0 0 auto; padding-top: 1px; }

/* automations list */
.auto-list { display: flex; flex-direction: column; }
.auto-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-muted); }
.auto-row:last-child { border-bottom: none; }
.auto-ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; flex: 0 0 30px; background: var(--canvas-subtle); border: 1px solid var(--border-default); color: var(--fg-muted); }
.auto-meta { flex: 1; min-width: 0; }
.auto-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.auto-desc { font-size: 11px; color: var(--fg-muted); font-family: var(--mono); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggle {
  width: 38px; height: 22px; border-radius: 20px; flex: 0 0 38px;
  background: var(--canvas-subtle); border: 1px solid var(--border-default);
  position: relative; cursor: pointer; transition: background .15s, border-color .15s;
}
.toggle .knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-muted); transition: transform .15s, background .15s; }
.toggle.on { background: var(--success-emphasis); border-color: var(--success-emphasis); }
.toggle.on .knob { transform: translateX(16px); background: #fff; }

/* status badge variants */
.b-ok { background: var(--success-muted); color: var(--success-fg); }
.b-warn { background: var(--attention-muted); color: var(--attention-fg); }
.b-err { background: var(--danger-muted); color: var(--danger-fg); }
.b-idle { background: var(--canvas-subtle); color: var(--fg-muted); border: 1px solid var(--border-muted); }
.b-info { background: var(--accent-muted); color: var(--accent-fg); }

.tag { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 20px; font-family: var(--sans); display: inline-flex; align-items: center; gap: 4px; }

/* mini summary strip */
.summary-strip { display: flex; gap: 0; border: 1px solid var(--border-default); border-radius: 8px; background: var(--canvas-default); overflow: hidden; margin-bottom: 4px; }
.summary-cell { flex: 1; padding: 13px 16px; border-left: 1px solid var(--border-muted); }
.summary-cell:first-child { border-left: none; }
.summary-cell .sc-label { font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.03em; }
.summary-cell .sc-val { font-size: 19px; font-weight: 600; margin-top: 3px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.3px; }
.summary-cell .sc-sub { font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); margin-top: 1px; }

/* empty state for unbuilt sections */
.empty { display: grid; place-items: center; height: 100%; padding: 60px; }
.empty-inner { text-align: center; max-width: 420px; }
.empty-ico { width: 64px; height: 64px; border-radius: 14px; background: var(--canvas-subtle); border: 1px solid var(--border-default); display: grid; place-items: center; margin: 0 auto 18px; color: var(--fg-muted); }
.empty h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.empty p { font-size: 14px; color: var(--fg-muted); margin-bottom: 18px; }
.empty .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-family: var(--mono); color: var(--fg-muted); border: 1px solid var(--border-default); border-radius: 20px; padding: 4px 12px; }
/* ============ SETTINGS ============ */
.conn-box { margin-bottom: 18px; }
.net-meta { margin-left: auto; font-size: 11.5px; color: var(--fg-muted); font-family: var(--mono); display: flex; align-items: center; gap: 6px; }
.net-meta .sep { color: var(--fg-subtle); }
.conn-grid { display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 880px) { .conn-grid { grid-template-columns: 1fr; } }
.conn-card { padding: 16px; display: flex; flex-direction: column; gap: 13px; align-items: flex-start; border-left: 1px solid var(--border-muted); }
.conn-card:first-child { border-left: none; }
@media (max-width: 880px) { .conn-card { border-left: none; border-top: 1px solid var(--border-muted); } .conn-card:first-child { border-top: none; } }
.cc-top { display: flex; gap: 11px; }
.cc-ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; flex: 0 0 30px; }
.cc-ico.blue { background: var(--accent-muted); color: var(--accent-fg); }
.cc-ico.green { background: var(--success-muted); color: var(--success-fg); }
.cc-title { font-size: 13px; font-weight: 600; }
.cc-desc { font-size: 12px; color: var(--fg-muted); margin-top: 2px; max-width: 36ch; line-height: 1.45; }
.cc-protos { display: flex; gap: 6px; }
.cc-actions { display: flex; gap: 8px; align-items: center; }
.proto-badge { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--fg-muted); background: var(--canvas-subtle); border: 1px solid var(--border-default); border-radius: 5px; padding: 1px 7px; }
.proto-badge.soft { color: var(--accent-fg); border-color: rgba(56,139,253,0.3); background: var(--accent-muted); }
.btn.ghost-danger { background: transparent; border-color: transparent; color: var(--fg-muted); padding: 5px 9px; }
.btn.ghost-danger:hover { background: var(--danger-muted); color: var(--danger-fg); border-color: transparent; }
.btn.ghost-danger svg { color: inherit; }

.spinner { width: 14px; height: 14px; border: 2px solid var(--border-default); border-top-color: var(--accent-fg); border-radius: 50%; animation: spin .7s linear infinite; flex: 0 0 14px; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.scan-panel { width: 100%; border: 1px solid var(--border-default); border-radius: 7px; background: var(--canvas-inset); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.scan-top { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--fg-default); font-family: var(--mono); }
.scan-top b { color: var(--accent-fg); font-weight: 600; }
.scan-protos { display: flex; gap: 8px; flex-wrap: wrap; }
.scan-proto { display: flex; align-items: center; gap: 6px; font-size: 11px; font-family: var(--mono); color: var(--fg-muted); border: 1px solid var(--border-muted); border-radius: 20px; padding: 2px 9px; }
.scan-proto .sp-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-fg); animation: pulse 1s ease-in-out infinite; }
.scan-proto .sp-tip { color: var(--fg-subtle); }
.scan-bar { height: 3px; border-radius: 3px; background: var(--border-muted); overflow: hidden; position: relative; }
.scan-bar i { position: absolute; left: -40%; width: 40%; height: 100%; background: var(--accent-fg); border-radius: 3px; animation: indet 1.1s ease-in-out infinite; }
@keyframes indet { 0% { left: -40%; } 100% { left: 100%; } }

.set-empty { border: 1px dashed var(--border-default); border-radius: 10px; background: var(--canvas-default); padding: 40px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.se-ico { width: 60px; height: 60px; border-radius: 14px; background: var(--accent-muted); color: var(--accent-fg); display: grid; place-items: center; margin-bottom: 16px; }
.set-empty h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.set-empty p { font-size: 13.5px; color: var(--fg-muted); max-width: 58ch; margin-bottom: 18px; line-height: 1.6; }
.se-actions { display: flex; gap: 10px; margin-bottom: 24px; }
.se-caps { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border-muted); padding-top: 18px; width: 100%; max-width: 580px; }
.se-cap { display: flex; align-items: center; gap: 7px; justify-content: center; flex-wrap: wrap; }
.se-cap-lbl { font-size: 11px; color: var(--fg-subtle); font-family: var(--mono); margin-left: 6px; }

.callout { display: flex; gap: 13px; align-items: center; border: 1px solid rgba(187,128,9,0.3); background: rgba(187,128,9,0.08); border-radius: 8px; padding: 13px 15px; margin-bottom: 10px; }
.callout-ico { width: 30px; height: 30px; border-radius: 7px; flex: 0 0 30px; display: grid; place-items: center; background: var(--attention-muted); color: var(--attention-fg); }
.callout-body { flex: 1; min-width: 0; }

function Sparkline({ data, color, height = 30 }) {
  const w = 200, h = height, pad = 2;
  const min = Math.min(...data), max = Math.max(...data);
  const rng = max - min || 1;
  const pts = data.map((v, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = pad + (1 - (v - min) / rng) * (h - pad * 2);
    return [x, y];
  });
  const line = pts.map((p) => p.join(",")).join(" ");
  const area = `${pad},${h} ${line} ${w - pad},${h}`;
  const gid = "g" + Math.abs(data[0] * 1000 | 0) + color.slice(1);
  return (
    <svg className="s-spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: "100%" }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.22" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <polygon points={area} fill={`url(#${gid})`} />
      <polyline points={line} fill="none" stroke={color} strokeWidth="1.5"
        strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
      <circle cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="2" fill={color} />
    </svg>
  );
}

        <span className="dev-kind">{kind === "control" ? "Controllable equipment" : "Read-only sensor"}</span>
        {role
          ? <span className={"role-pill " + (role.kind === "control" ? "ctl" : "sen")}><span className="rp-dot" />{role.name}</span>
          : <span className="role-pill unassigned"><IcoAlert s={11} />needs role</span>}
      </div>
    </div>
  );
}

function RoleSelect({ d, kind, onRole }) {
  const opts = ROLES.filter((r) => (kind === "control" ? r.kind === "control" : r.kind === "sense"));
  return (
    <select className="role-select" value={d.role || ""} disabled={!d.online} onChange={(e) => onRole(d.id, e.target.value || null)}>
      <option value="">Unassigned</option>
      <optgroup label={kind === "control" ? "Equipment roles" : "Sensor roles"}>
        {opts.map((r) => <option key={r.id} value={r.id}>{r.name}</option>)}
      </optgroup>
    </select>
  );
}

function RoleRow({ d, onRole }) {
  const kind = deviceKind(d);
  const role = d.role ? roleById(d.role) : null;
  const caps = d.metrics.map((m) => METRIC_META[m].label)
    .concat(d.controls.map((c) => RES_META[c.res].tag)).join(" · ") || "—";
  return (
    <div className={"role-row" + (d.online ? "" : " off")}>
      <div className="rr-dev">
        <span className={"online-dot" + (d.online ? "" : " off")} />
        <div className="rr-min">
          <div className="rr-name">{d.name}</div>
          <div className="rr-caps">{caps}</div>
        </div>
      </div>
      <div className="rr-detect">
        <span className={"detect-tag " + (kind === "control" ? "ctl" : "sen")}>{kind === "control" ? "Equipment" : "Sensor"}</span>
        {d.controls.map((c, i) => <span key={i} className="res-tag solo">{RES_META[c.res].tag}</span>)}
      </div>
      <div className="rr-role"><RoleSelect d={d} kind={kind} onRole={onRole} /></div>
      <div className="rr-unlock">
        {role
          ? <span className="unlock-on"><IcoBolt s={11} />{role.kind === "control" ? role.unlocks : "feeds automations"}</span>
          : <span className="unlock-off">assign to enable</span>}
      </div>
    </div>
  );
}

function ScanPanel({ found }) {
  return (
    <div className="scan-panel">
      <div className="scan-top"><span className="spinner" /><span>Scanning <b>192.168.1.0/24</b> · {found} device{found !== 1 ? "s" : ""} found</span></div>
      <div className="scan-protos">
        {Object.keys(PROTO).map((k) => (
          <span className="scan-proto" key={k}><span className="sp-dot" />{PROTO[k].label}<span className="sp-tip">{PROTO[k].tip}</span></span>
        ))}
      </div>
      <div className="scan-bar"><i /></div>
    </div>
  );
}

function ProvisionModal({ onClose }) {
  const [step, setStep] = useState(0);
  const steps = ["Pairing", "Select", "Wi-Fi", "Joining"];
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><IcoWifi s={16} /><h3>Provision a new device</h3><button className="icon-ghost" onClick={onClose}><IcoX s={15} /></button></div>
        <div className="modal-steps">
          {steps.map((s, i) => (
            <div key={i} className={"mstep" + (i === step ? " on" : "") + (i < step ? " done" : "")}>
              <span className="mstep-n">{i < step ? <IcoCheck s={10} /> : i + 1}</span>{s}
            </div>
          ))}
        </div>
        <div className="modal-body">
          {step === 0 && <p>Hold the device’s pairing button for 5 seconds until its LED blinks, then continue. Canopy listens for a SoftAP or BLE beacon.</p>}
          {step === 1 && (<><p style={{ marginBottom: 4 }}>Found a device in setup mode:</p><div className="prov-ap"><IcoWifi s={15} /><span className="pa-name">Canopy-Setup-A1B2</span><span className="tag b-info" style={{ marginLeft: "auto", fontSize: 10 }}>SoftAP</span></div></>)}
          {step === 2 && (
            <><div className="field"><label>Network</label><select className="fsel"><option>GrowNet-5G</option><option>GrowNet-2.4G</option></select></div>
            <div className="field"><label>Password</label><input type="password" defaultValue="growroom" /></div></>
          )}
          {step === 3 && <div className="prov-joining"><span className="spinner" /> Joining “GrowNet-5G” and registering capabilities…</div>}
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={onClose}>Cancel</button>
          <span className="spacer" />
          {step < 3
            ? <button className="btn primary" onClick={() => setStep(step + 1)}>Continue</button>
            : <button className="btn primary" onClick={onClose}><IcoCheck s={13} /> Done</button>}
        </div>
      </div>
    </div>
  );
}

function ConnectionArea({ scan, found, onScan, onProvision, hasDevices, onForget }) {
  return (
    <div className="box conn-box">
      <div className="box-head">
        <h3>Connection</h3>
        <span className="count">local network</span>
        <span className="net-meta"><IcoWifi s={13} /> GrowNet-5G <span className="sep">·</span> controller 192.168.1.4 <span className="sep">·</span> /24</span>
      </div>
      <div className="conn-grid">
        <div className="conn-card">
          <div className="cc-top">
            <span className="cc-ico blue"><IcoRadar s={16} /></span>
            <div><div className="cc-title">Discover on local network</div><div className="cc-desc">Find devices already on Wi-Fi across mDNS, MQTT and Matter.</div></div>
          </div>
          <div className="cc-protos"><ProtoBadge proto="mdns" /><ProtoBadge proto="mqtt" /><ProtoBadge proto="matter" /></div>
          {scan === "scanning"
            ? <ScanPanel found={found} />
            : <div className="cc-actions">
                <button className="btn primary" onClick={onScan}><IcoRadar s={14} /> {hasDevices ? "Re-scan network" : "Scan network"}</button>
                {hasDevices && <button className="btn ghost-danger" onClick={onForget}><IcoTrash s={13} /> Forget all</button>}
              </div>}
        </div>
        <div className="conn-card">
          <div className="cc-top">
            <span className="cc-ico green"><IcoWifi s={16} /></span>
            <div><div className="cc-title">Provision a new device</div><div className="cc-desc">Onboard a brand-new device and join it to your Wi-Fi network.</div></div>
          </div>
          <div className="cc-protos"><span className="proto-badge soft">SoftAP</span><span className="proto-badge soft">BLE</span></div>
          <div className="cc-actions"><button className="btn" onClick={onProvision}><IcoPlus s={14} /> Start setup</button></div>
        </div>
      </div>
    </div>
  );
}

function SettingsEmpty({ onScan, onProvision }) {
  return (
    <div className="set-empty">
      <div className="se-ico"><IcoRadar s={30} /></div>
      <h2>No devices connected yet</h2>
      <p>Connect your sensors and equipment to start monitoring and automating. Canopy detects each device’s <b>readable metrics</b> and <b>writable controls</b> — those capabilities are what unlock automations across the rest of the app.</p>
      <div className="se-actions">
        <button className="btn primary" onClick={onScan}><IcoRadar s={14} /> Scan network</button>
        <button className="btn" onClick={onProvision}><IcoWifi s={14} /> Provision new device</button>
      </div>
      <div className="se-caps">
        <div className="se-cap">
          <span className="cap-chip" style={{ color: "#f78166" }}><IcoTemp s={12} />Temp</span>
          <span className="cap-chip" style={{ color: "#2f81f7" }}><IcoDrop s={12} />Humidity</span>
          <span className="cap-chip" style={{ color: "#3fb950" }}><IcoCo2 s={12} />CO₂</span>
          <span className="cap-chip" style={{ color: "#d29922" }}><IcoSeedling s={12} />Soil</span>
          <span className="se-cap-lbl">readable metrics</span>
        </div>
        <div className="se-cap">
          <span className="ctrl-chip"><IcoPlug s={12} />on / off</span>
          <span className="ctrl-chip"><IcoSlider s={12} />variable</span>
          <span className="ctrl-chip"><IcoTarget s={12} />setpoint</span>
          <span className="se-cap-lbl">writable controls</span>
        </div>
      </div>
    </div>
  );
}

function SettingsPage({ seed }) {
  const [devices, setDevices] = useState(seed.devices);
  const [scan, setScan] = useState(seed.scan);
  const [found, setFound] = useState(seed.devices.length);
  const [prov, setProv] = useState(false);
  const timers = React.useRef([]);
  const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };

  const startScan = () => {
    clearTimers();
    setScan("scanning"); setDevices([]); setFound(0);
    CONFIGURED_DEVICES.forEach((d, i) => {
      timers.current.push(setTimeout(() => { setDevices((prev) => [...prev, d]); setFound((c) => c + 1); }, 450 + i * 420));
    });
    timers.current.push(setTimeout(() => setScan("done"), 450 + CONFIGURED_DEVICES.length * 420 + 500));
  };
  React.useEffect(() => () => clearTimers(), []);

  const forgetAll = () => { clearTimers(); setDevices([]); setScan("idle"); setFound(0); };
  const setRole = (id, role) => setDevices((prev) => prev.map((d) => (d.id === id ? { ...d, role } : d)));

  const online = devices.filter((d) => d.online).length;
  const totalMetrics = devices.reduce((n, d) => n + (d.online ? d.metrics.length : 0), 0);
  const totalControls = devices.reduce((n, d) => n + (d.online ? d.controls.length : 0), 0);
  const assigned = devices.filter((d) => d.role).length;
  const unassigned = devices.filter((d) => !d.role && d.online).length;
  const showEmpty = scan !== "scanning" && devices.length === 0;

  return (
    <>
      <div className="content-header">
        <div className="ch-titles">
          <div className="ch-crumb">Tent 1 <span className="sep">/</span> Configuration <span className="sep">/</span> Settings</div>
          <div className="ch-title">Settings
            {devices.length > 0 && <span className="tag b-ok"><span className="dot-live" style={{ width: 7, height: 7 }} />{online} online</span>}
          </div>
        </div>
        <div className="ch-actions">
          {scan === "done" && <button className="btn btn-icon" title="Re-scan" onClick={startScan}><IcoRefresh s={15} /></button>}
          <button className="btn"><IcoExternal s={14} /> Docs</button>
        </div>
      </div>

      <div className="scroll">
        <div className="canvas-pad">
          <ConnectionArea scan={scan} found={found} onScan={startScan} onProvision={() => setProv(true)} hasDevices={devices.length > 0} onForget={forgetAll} />

          {showEmpty && <SettingsEmpty onScan={startScan} onProvision={() => setProv(true)} />}

          {!showEmpty && (
            <>
              <div className="callout">
                <span className="callout-ico"><IcoBolt s={16} /></span>
                <div className="callout-body">
                  <div className="callout-title">Capabilities unlock automation</div>
                  <div className="callout-text">Detected metrics and controls determine which automations are available. Pair a <b>sensor role</b> with an <b>equipment role</b> to enable an automation in <span className="mono-ref">Automation</span>.</div>
                </div>
                <div className="callout-stats">
                  <span><b>{totalMetrics}</b> metrics</span><span className="sep">·</span>
                  <span><b>{totalControls}</b> controls</span><span className="sep">·</span>
                  <span><b>{assigned}</b> roles set</span>
                </div>
              </div>

              <div className="sec-head">
                <h2>Discovered devices</h2>
                <span className="count">{devices.length} found{scan === "scanning" ? " · scanning" : ""}</span>
                <span className="rule" />
                <span className="link">Add manually</span>
              </div>
              <div className="dev-list">
                {devices.map((d) => <DeviceCard key={d.id} d={d} />)}
              </div>

              {scan === "done" && (
                <>
                  <div className="sec-head" style={{ marginTop: 28 }}>
                    <h2>Device roles</h2>
                    <span className="count">{assigned}/{devices.length} assigned</span>
                    <span className="rule" />
                    {unassigned > 0 && <span className="tag b-warn" style={{ fontSize: 11 }}><IcoAlert s={11} />{unassigned} need a role</span>}
                  </div>
                  <div className="roles-box">
                    <div className="roles-head"><span>Device</span><span>Detected as</span><span>Grow role</span><span>Unlocks</span></div>
                    {devices.map((d) => <RoleRow key={d.id} d={d} onRole={setRole} />)}
                  </div>
                </>
              )}
            </>
          )}
        </div>
      </div>

      {prov && <ProvisionModal onClose={() => setProv(false)} />}
    </>
  );
}

/* ============================================================
   SHELL
============================================================ */
function App({ initialSection = "overview", settingsSeed, overviewEmpty = false } = {}) {
  const [active, setActive] = useState(initialSection);
  const SETTINGS_SEED = settingsSeed || { devices: CONFIGURED_DEVICES, scan: "done" };
  const [range, setRange] = useState("24H");
  const [tick, setTick] = useState(0);
  const lastSync = useMemo(() => (tick === 0 ? "12s ago" : "just now"), [tick]);

  const groups = useMemo(() => {
    const order = ["Monitor", "Control", "Records", "Config"];
    const map = {};
    NAV.forEach((n) => { (map[n.group] = map[n.group] || []).push(n); });
    return order.map((g) => ({ group: g, items: map[g] }));
  }, []);

  const activeItem = NAV.find((n) => n.id === active);

  return (
    <div className="app">
      {/* TITLEBAR */}
      <div className="titlebar">
        <div className="traffic"><span className="r" /><span className="y" /><span className="g" /></div>
        <div className="tb-brand">
          <span className="mark"><IcoLeaf s={13} /></span>
          Canopy
        </div>
        <div className="tb-spacer" />
        <div className="cmdk">
          <IcoSearch s={14} />
          <span>Search sensors, automations, logs…</span>
          <span className="kbd">⌘K</span>
        </div>
        <button className="tb-icon-btn" title="Notifications"><IcoBell s={16} /></button>
        <button className="tb-icon-btn" title="Settings"><IcoGear s={16} /></button>
        <div className="tb-avatar">GA</div>
      </div>

      <div className="body">
        {/* SIDEBAR */}
        <aside className="sidebar">
          <div className="workspace">
            <div className="ws-ico"><IcoSeedling s={16} /></div>
            <div className="ws-meta">
              <div className="ws-name">Tent 1 — Veg</div>
              <div className="ws-sub"><span className="dot-live" style={{ width: 6, height: 6, boxShadow: "none" }} /> 5 sensors · 8 devices</div>
            </div>
            <span className="chev"><IcoChevron s={14} /></span>
          </div>

          <nav className="nav">
            {groups.map((g) => (
              <div key={g.group}>
                <div className="nav-group-label">{g.group}</div>
                {g.items.map((n) => {
                  const Icon = n.icon;
                  return (
                    <button key={n.id} className={`nav-item ${active === n.id ? "active" : ""}`} onClick={() => setActive(n.id)}>
                      <span className="ni-ico"><Icon s={16} /></span>
                      {n.label}
                      {n.count != null && <span className="ni-count">{n.count}</span>}
                    </button>
                  );
                })}
              </div>
            ))}
          </nav>

          <div className="sb-footer">
            <span className="dot-live" />
            <span>Controller online</span>
            <span className="gear" title="Connection"><IcoExternal s={14} /></span>
          </div>
        </aside>

        {/* MAIN */}
        <main className="main">
          {active === "overview"
            ? <Overview range={range} onRange={setRange} lastSync={lastSync} onRefresh={() => setTick((t) => t + 1)} empty={overviewEmpty} onGoSettings={() => setActive("settings")} />
            : active === "settings"
            ? <SettingsPage seed={SETTINGS_SEED} />
            : <Placeholder item={activeItem} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App overviewEmpty />);

</script>
</body>
</html>
